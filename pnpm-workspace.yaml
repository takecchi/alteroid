packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true

catalog:
  # typescript-eslint が TS 7（ネイティブコンパイラ）未対応のため 6 系に固定（peer: >=4.8.4 <6.1.0）
  typescript: ^6.0.3
  tsup: ^8.5.1
  # root の `format:check` と apps/daemon の write-openapi.mjs（openapi.json を
  # 整形して書き出す）が同じ版を使う必要がある。片方だけ上がると整形結果がずれ、
  # 「コードは変えていないのに openapi.json に差分が出る」で CI が振れる。
  prettier: ^3.9.6
  # CI の実行系（Node 22）に合わせる
  '@types/node': ^22.20.1
  '@anthropic-ai/claude-agent-sdk': ^0.3.228
  hono: ^4.13.1
  '@hono/node-server': ^2.1.0
  '@hono/zod-validator': ^0.9.0
  zod: ^4.4.3
  commander: ^15.0.0
  # 継続中の依頼の周期。人間が cron で書けることをこの階層でも書けるようにする。
  # 依存ゼロ・ESM・型付きなので croner を採った（cron-parser は luxon を連れてくる）
  croner: ^10.0.1
  # OpenAPI（外から API を記述できるようにするための一式。Issue #20）
  #
  # 生成側は hono-openapi。既存のチェーン記法と `AppType`（CLI の `hc<AppType>` が
  # 依存している）をそのまま保てるため、@hono/zod-openapi（全ルートを createRoute へ
  # 書き換える必要がある）は採らなかった。
  hono-openapi: ^1.3.1
  '@hono/standard-validator': ^0.4.0
  '@standard-community/standard-json': ^0.3.5
  '@standard-community/standard-openapi': ^0.2.9
  'openapi-types': ^12.1.3
  # 人間が読む画面（GET /docs）
  '@scalar/hono-api-reference': ^0.11.13
  # 外部向けの生成クライアント（fetch ベース・軽量）
  'openapi-typescript': ^7.13.0
  'openapi-fetch': ^0.17.0
  # クラウド段（M4）の記憶ストア
  drizzle-orm: ^0.45.2
  pg: ^8.23.0
  '@types/pg': ^8.21.0
  # pg ドライバのテスト用。実 PostgreSQL をインプロセスで動かす（CI に DB を要求しない）
  '@electric-sql/pglite': ^0.5.4
  # Web UI（apps/web）。React Router v7 を SPA モード（ssr: false）で使う。
  #
  # **SSR を採らないのは配置の自由のため。** デーモンをどこに置き、画面をどこに置くかは
  # 人によって違う（同一ホスト / api.example.com + www.example.com / 静的ホスティング）。
  # サーバを持たない静的成果物なら、そのどれにも同じものを置ける。
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  react-router: ^7.18.2
  '@react-router/dev': ^7.18.2
  # SPA でもビルド時に要る（index.html を書き出す側が実行系を要求する）。
  # 成果物は静的なので、これが動くのはビルドの中だけ。
  #
  # **どちらも `dependencies` に置くこと。** react-router のビルドは
  # `package.json` の `dependencies` だけを見て実行系を判定し、`isbot` が
  # 無いと**ビルド中に package.json を書き換えて `pnpm install` を走らせる**。
  # CI でそれが起きると、成果物の生成が依存関係の書き換えを伴う。
  '@react-router/node': ^7.18.2
  isbot: ^5.2.1
  vite: ^8.2.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  # 取得とキャッシュ。SSE で届いた出来事から `mutate` で無効化する使い方をする。
  # 2.5 系は出たばかりで minimumReleaseAge に引っかかる。**除外リストに足して
  # 通すのではなく**、枯れている 2.4 系を採る（除外リストは SDK の意図的な固定の
  # ためのものであって、新しい版を素通しするための場所ではない）
  # `^` だと 2.5 系まで入ってしまうので `~` で 2.4 系に留める
  swr: ~2.4.2
  clsx: ^2.1.1
  # Web UI（apps/web）で AI の応答・日報・マネージャーの報告を Markdown として
  # 描画する（人間の依頼: 「AIの返答ってMarkdown返却多いからWebUIも表示を
  # Markdownにしたほうがこっちとしては見やすい」）。
  #
  # react-markdown を採ったのは、remark（Markdown→mdast）→ remark-rehype
  # （mdast→hast）→ hast-util-to-jsx-runtime（hast→React 要素）で完結し、
  # **`dangerouslySetInnerHTML` も HTML 文字列も経由しない**ため。HTML 文字列を
  # 作ってから貼る方式（`marked` + `dangerouslySetInnerHTML` など）は、サニタイズを
  # 足し忘れた瞬間に注入経路になる。react-markdown はその経路自体が無い。
  # remark-gfm は表・取り消し線・タスクリストなど GFM 拡張のため（AI も日報も
  # 表を返すことがある）。
  #
  # remark-breaks も併せて入れる。素の Markdown は単独の改行を畳んで表示する
  # （半角スペース2つや空行での改行と区別しない）。この画面はこれまで
  # `whitespace-pre-wrap` で改行をそのまま見せていたので、remark-breaks が
  # 無いと「今まで見えていた行区切りが消える」という劣化になる。
  #
  # **`rehype-raw` は入れない。** 生の HTML を hast へ解釈し直す道具で、これを
  # 足した瞬間に本文中の `<script>` や `onerror` 付きタグがそのまま要素として
  # 解釈される注入経路が生まれる。足したくなったら
  # `apps/web/app/components/markdown.tsx` の同じ注記と、
  # `apps/web/app/components/markdown.test.tsx` の「生 HTML が要素にならない」
  # テストを先に見ること。
  'react-markdown': ^10.1.0
  'remark-gfm': ^4.0.1
  'remark-breaks': ^4.0.0
  # 画面の回帰テスト（描画して操作する分だけ。DOM が要るファイルにだけ jsdom を指定する）
  jsdom: ^30.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/dom': ^10.4.1
  tailwind-merge: ^3.6.0
  lucide-react: ^1.31.0
  # shadcn/ui（apps/web）。**既存の部品を置き換えるためではない** — 足回り（clsx /
  # tailwind-merge / cn / lucide-react）は上に既にあり、shadcn を入れて手に入るものは
  # もう手元にある。入れているのは**自前では書きたくない振る舞いを持つ部品**（いまは
  # sheet ＝ Radix Dialog。焦点の閉じ込め・スクロールの固定・`aria-modal`）のためである。
  #
  # `radix-ui` は統合パッケージ（`@radix-ui/react-*` を個別に入れない）。shadcn の
  # radix 系スタイルが `import { Dialog } from 'radix-ui'` の形で吐くので、これに揃える。
  'radix-ui': ^1.6.7
  # shadcn が吐く部品の variant 定義（`cva`）。
  'class-variance-authority': ^0.7.1
  # `animate-in` / `slide-in-from-left-*`（sheet の出入り）。**色は1つも持たない**
  # （中身は @property と @utility だけ）ので、既存のパレットには触れない。
  'tw-animate-css': ^1.4.0
  # `@import 'shadcn/tailwind.css'` の実体（`data-open` / `data-closed` などの
  # custom variant。sheet の class がこれを前提にしている）。**dependencies に置く**
  # のは、これが CSS の import 元だからである。同じものが `shadcn add` の CLI でもあり、
  # 版が固定されるので `npx shadcn@latest`（毎回違う版が降ってくる）を避けられる。
  shadcn: ^4.18.0

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.228'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.228'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.228'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.228'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.228'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.228'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.228'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.228'
  - '@anthropic-ai/claude-agent-sdk@0.3.228'
