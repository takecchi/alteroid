name: setup
description: >-
  ci.yml の各 job が共通に要る準備（mise で Node と pnpm、pnpm store のキャッシュ、
  pnpm install）。checkout は呼び出し側で先に済ませること（この action は
  リポジトリの中に在るので、checkout より前には読めない）。

runs:
  using: composite
  steps:
    # **ディスクの空きを、この action の前・キャッシュ復元の後・終わりの3点で記録する（Issue #6339）。**
    # 実行機のディスク不足で job が落ちると、実行機の診断ログすら書けず、落ちた step も
    # ログも残らない（#6339 の4回とも、落ちた試行のログは取得できなかった）。どこで
    # 埋まったかを後から言えるのは、落ちる前に出しておいた行だけである。
    - name: ディスクの空き（setup の前）
      shell: bash
      run: df -h / /home/runner/work /tmp
    # Node と pnpm の版は mise.toml が持つ（ローカルと同じものを使う）
    - uses: jdx/mise-action@v5
    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    # **キーの接頭辞に `v2` を入れてあるのは、肥大した古い store を二度と復元しないためである（Issue #6339）。**
    # `restore-keys` の前方一致で前の store を引き継ぎ、install で足して新しいキーで保存する形は、
    # 一度も掃除されないので lockfile が変わるたびに膨らむ。実測（2026-11-04）: 保存されていた
    # キャッシュは圧縮で 3,799 MB（`Linux-pnpm-b2315596…`）、いまの lockfile だけから作った store は
    # 展開して 1.3 GB・gzip で 454 MB。⟹ 約8倍に膨れたものを毎回取得して展開しており、
    # 落ちた4回はどれもその展開の最中（job の開始から1〜1.5分）だった。
    # 接頭辞を戻す・`restore-keys` を `Linux-pnpm-` にすると、古いキャッシュが前方一致で当たって元に戻る。
    - id: pnpm-cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-v2-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-v2-
    - name: ディスクの空き（pnpm store の復元の後）
      shell: bash
      run: |
        df -h / /home/runner/work /tmp
        du -sh "${{ steps.pnpm-store.outputs.path }}" || true
    - run: pnpm install --frozen-lockfile
      shell: bash
    # **保存する回だけ、いまの lockfile が参照しない包みを store から落とす（Issue #6339）。**
    # キーが完全一致した回は actions/cache が保存しないので、掃除しても無駄になる。
    # 前方一致（`restore-keys`）で古い store を引き継いだ回がまさに膨らむ回なので、そこで落とす。
    # これを外すと、上の `v2` で一度リセットしても、lockfile が変わるたびにまた膨らむ。
    - name: pnpm store から参照されない包みを落とす（保存する回だけ）
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        pnpm store prune
        du -sh "${{ steps.pnpm-store.outputs.path }}"
    - name: ディスクの空き（setup の後）
      shell: bash
      run: df -h / /home/runner/work /tmp
