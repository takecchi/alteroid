name: PR title

# **PR のタイトルが規約の型（`<type>: <description>`）を持つことだけを見る門**
# （Issue #1097）。判定ロジックは `scripts/check-pr-title-type-core.mjs` が正本
# （fail-closed の理由・`(scope)` と先頭の `[…]` を許して `!` を許さない理由の
# 実測はあちらの doc）。ここは呼び出しだけ。
#
# **塞ぐ経路**: GitHub の squash マージは、コミットの件名ではなく **PR の
# タイトル**を件名として焼く。⟹ 積んだコミットが全部規約どおりでも、PR の
# タイトルに型が無ければ `main` の件名から型が消える。実測（#1097、
# 2026-09-16）: `main` 直近200本中 **14本**が型を持たない。
#
# **squash マージが件名を焼く同じ機構の、反対側の漏れである。** 同じ機構を見る
# `no-attribution-trailers`（PR **本文** → コミットメッセージ、#1020。#1108 で
# `ci.yml` から独立した `no-attribution-trailers.yml` へ出た）が既に在ったが、
# PR **タイトル** → 件名の側には門が無かった。

# ## なぜ `ci.yml` の中に置かず、別の workflow にしたか
#
# **`edited` が要るからである。** PR のタイトルは後から変えられるので、
# `opened` だけの門は素通りする。ところが `ci.yml` の `pull_request.types` は
# `edited` を含まない（`grep -Fn -- 'types: [opened, synchronize, reopened, ready_for_review]' .github/workflows/ci.yml`）。
#
# そこへ `edited` を足すと、**PR 本文を1文字直すたびに `ci` と `image`（どちらも
# required）が焼き直される。** 節約のために `if:` で抑えると、今度は required の
# 文脈に `skipped` が入る —— `AGENTS.md`「静かに失敗する道具」と、`ci.yml` が
# `ready_for_review` を types へ足した理由そのものの罠を持ち込むことになる。
#
# ⟹ **タイトル検査を持つこの workflow に `edited` を付け、`ci.yml` の trigger は
# 1文字も触らない。**（#1108 で `no-attribution-trailers.yml` も同じ形で合流した
# ——「この workflow にだけ」ではなくなったが、「`ci.yml` には付けない」は変わらない。）
on:
  pull_request:
    # **`edited` がこの門の要である**（タイトルの後からの書き換えを捕まえる）。
    #
    # **`synchronize` も必須である。** required status check は head sha ごとに
    # 要るので、push で sha が変わったのに run が起きないと、その PR は**永久に
    # 満たせなくなる**（`ci.yml` が記録している「draft のまま一生 skip される」
    # 事故と同じ族）。`reopened` / `ready_for_review` も同じ理由で足してある。
    types: [opened, edited, synchronize, reopened, ready_for_review]

# `ci.yml` と同じ形（理由の逐語は
# `grep -Fn -- '同じ PR に続けて push したとき、古い実行を残さない' .github/workflows/ci.yml`）。
# ここでは `pull_request` しか起きないので `head_ref` は必ず入るが、**`||` の側は
# 落とさない** —— 空文字のキーで全 PR が1つの群に入る形を作らないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # **ジョブ名がそのまま required status check の名前になる**
  # （正本は `.github/required-status-checks.json`。**ここに値を書き写さない**）。
  pr-title-type:
    # **`no-attribution-trailers` と同じく draft でも skip しない。** `if:` で
    # 節約すると、draft 由来の `skipped` が「満たした」として扱われる罠を
    # 持ち込む。この検査は `gh api` を1回叩くだけで軽く、節約する理由が無い。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: pnpm check:pr-title-type
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_TITLE_TYPE_PR_NUMBER: ${{ github.event.pull_request.number }}
