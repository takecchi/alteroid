name: PR closing keywords

# **PR のタイトル・本文・コミットメッセージに残った「閉じるキーワード＋参照」が、
# 書き手の意図に反して Issue を閉じる形になっていないかだけを見る門**
# （Issue #1109）。判定ロジックは `scripts/check-pr-closing-keywords-core.mjs` が
# 正本（キーワード・参照の形・通す形／落とす形の5分類・優先順位・公式 doc で
# 確認できたこと/できなかったことの実測はあちらの doc）。ここは呼び出しだけ。
#
# **塞ぐ経路**: GitHub の「閉じるキーワード」（`Closes #123` 等）は、書いた側の
# 意図を2通りの形で無視し、どちらも「閉じる」側へ倒れる。この repo で2日のうちに
# 2回、同じ Issue（#993）が意図せず閉じた——PR #1095 の裸のキーワード
# （`Closes #993 の段1。`。GitHub は番号までしか読まない）と、PR #1107 の
# バッククォートで囲んだだけのキーワード（それでも閉じた）。**閉じたことは PR の
# 側に1文字も出ない**（CI は緑、マージも成功、警告も出ない）。

# ## なぜ `ci.yml` の中に置かず、別の workflow にしたか
#
# **`edited` が要るからである**（`no-attribution-trailers.yml` と同じ理由）。PR のタイトルも
# 本文も後から変えられるので、`opened` だけの門は素通りする。ところが `ci.yml`
# の `pull_request.types` は `edited` を含まない
# （`grep -Fn -- 'types: [opened, synchronize, reopened, ready_for_review]' .github/workflows/ci.yml`）。
#
# そこへ `edited` を足すと、**PR 本文を1文字直すたびに `ci` と `image`（どちらも
# required）が焼き直される。** 節約のために `if:` で抑えると、今度は required の
# 文脈に `skipped` が入る —— `AGENTS.md`「静かに失敗する道具」と、`ci.yml` が
# `ready_for_review` を types へ足した理由そのものの罠を持ち込むことになる。
#
# ⟹ **この検査だけを持つこの workflow にだけ `edited` を付け、`ci.yml` の
# trigger は1文字も触らない。**
on:
  pull_request:
    # **`edited` がこの門の要である**（タイトル・本文の後からの書き換えを
    # 捕まえる。この門はまさに「後から編集で紛れ込む」形を主な対象にしている）。
    #
    # **`synchronize` も必須である。** この workflow は required status check
    # ではないが（下の「required にしない」）、それでも head sha が変わるたびに
    # push 時点の内容を判定し直さないと、**古い sha の判定結果のまま、新しい
    # push で紛れ込んだキーワードを見逃す。** `reopened` / `ready_for_review` も
    # 同じ理由で足してある（`ci.yml` が記録している「draft のまま一生 skip
    # される」事故とは別の理由だが、`types` を揃える判断は同じである）。
    types: [opened, edited, synchronize, reopened, ready_for_review]

# `no-attribution-trailers.yml` と同じ形（理由の逐語は
# `grep -Fn -- '同じ PR に続けて push したとき、古い実行を残さない' .github/workflows/ci.yml`）。
# ここでは `pull_request` しか起きないので `head_ref` は必ず入るが、**`||` の側は
# 落とさない** —— 空文字のキーで全 PR が1つの群に入る形を作らないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # **ジョブ名 `pr-closing-keywords`。**
  #
  # **⚠️ この門は required にしない（決定。変えない）。**
  #
  # - **逃げ道が「required でないこと」そのものである。** この門は「書いた側の
  #   意図」を読めない——キーワード＋参照が対だけの行に無い、というだけで機械的に
  #   落とす。だから、どうしても本文にキーワードの逐語を書く必要がある回
  #   （たとえばこの誤爆そのものを説明する PR。実際にこの PR 自身がその一例）に、
  #   **赤いまま進む道を残す必要がある。** required にするなら、逃げ道
  #   （ラベル等での例外）を同時に設計しなければならない——それはこの PR の
  #   範囲外の判断である。
  # - **required contexts を変えるのは GitHub のブランチ保護の設定変更であり、
  #   この PR の権限の外である。**`.github/required-status-checks.json`
  #   （protection の宣言。正本はあちら）は1文字も触らない——あそこへ足すと
  #   「宣言に在るのに protection に無い」という drift をこちらで新しく作る
  #   ことになる（`base-overlap` を required にしない判断と同じ理由。逐語は
  #   `grep -Fn -- '入れていない' .github/workflows/ci.yml` の周辺）。
  pr-closing-keywords:
    # **`no-attribution-trailers` / `pr-vanished-footprint` と同じく draft でも skip
    # しない。** `if:` で節約すると、draft 由来の `skipped` が「満たした」として
    # 扱われる罠を持ち込む。この検査は `gh api` を1回叩くだけで軽く、節約する
    # 理由が無い。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: pnpm check:pr-closing-keywords
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_CLOSING_KEYWORDS_PR_NUMBER: ${{ github.event.pull_request.number }}
