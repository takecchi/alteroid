name: PR line number citations

# **PR 本文が、実在するリポジトリのファイルを `path:行番号` の形で単独の出典に
# していないかだけを見る門**（Issue #1192 の N3 に対応する）。判定ロジックは
# `scripts/check-pr-line-number-citations-core.mjs` が正本（弾く形／弾かない形の
# 実測根拠・required にしない理由・確かめていないことはあちらの doc）。ここは
# 呼び出しだけ。
#
# **塞ぐ経路**: `AGENTS.md`「リポジトリの約束」は「他のファイルを出典として指す
# ときは、行番号を単独の出典にしない。逐語の一部かシンボル名で指す」と定め、
# 「この文書・コードの注釈・PR 本文のどれでも同じである」と明記している。ところが
# 既存の歯（`scripts/agents-md-references.test.ts`）は `AGENTS.md` 本体と
# `.claude/**` / `*/src/**` / `apps/web/app/**` / `scripts/**` しか測らず、PR 本文を
# 読む3本（`pr-vanished-footprint` / `no-attribution-trailers` / `pr-closing-keywords`）
# のどれも「行番号」を見ていなかった（Issue #1192 の N3 が指摘した穴）。

# ## なぜ `ci.yml` の中に置かず、別の workflow にしたか
#
# **`edited` が要るからである**（`pr-closing-keywords.yml` と同じ理由）。PR 本文は
# 後から変えられるので、`opened` だけの門は素通りする。`ci.yml` の
# `pull_request.types` は `edited` を含まないため、`ci.yml` へ足すと required な
# `ci` / `image` が本文の編集ごとに焼き直される。⟹ **この検査だけを持つこの
# workflow にだけ `edited` を付け、`ci.yml` の trigger は1文字も触らない。**
on:
  pull_request:
    # **`edited` がこの門の要である**（本文の後からの書き換えを捕まえる）。
    # **`synchronize` も必須**（head sha が変わるたびに push 時点の内容を判定し
    # 直す。古い sha の判定結果のまま新しい push を見逃さない）。`reopened` /
    # `ready_for_review` も同じ理由で足してある（`pr-closing-keywords.yml` と同じ
    # 判断）。
    types: [opened, edited, synchronize, reopened, ready_for_review]

# `pr-closing-keywords.yml` と同じ形（理由の逐語は
# `grep -Fn -- '同じ PR に続けて push したとき、古い実行を残さない' .github/workflows/ci.yml`）。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # **ジョブ名 `pr-line-number-citations`。**
  #
  # **⚠️ この門は required にしない（決定。変えない）。**
  #
  # - **逃げ道が「required でないこと」そのものである。** この門は書いた側の
  #   意図を読めない——インラインのコードスパンも弾かない選択の結果（実測根拠は
  #   `check-pr-line-number-citations-core.mjs` の doc）、実在ファイルへの
  #   `path:行番号` の言及はほぼ機械的に赤くなる。その中には「過去に壊れていた
  #   出典を直した経緯の説明」（実例: PR #892）のような、本物の違反ではない回が
  #   混ざりうる。**どうしても本文に `path:行番号` の逐語を書く必要がある回に、
  #   赤いまま進む道を残す必要がある。** required にするなら、逃げ道（ラベル等）を
  #   同時に設計しなければならず、それはこの PR の範囲外の判断である
  #   （`pr-closing-keywords.yml` / `pr-vanished-footprint.yml` と同じ族の判断）。
  # - **required contexts を変えるのは GitHub のブランチ保護の設定変更であり、
  #   この PR の権限の外である。**`.github/required-status-checks.json`（正本は
  #   あちら）は1文字も触らない。
  pr-line-number-citations:
    # **draft でも skip しない**（`no-attribution-trailers` / `pr-vanished-footprint` /
    # `pr-closing-keywords` と同じ。`if:` で節約すると draft 由来の `skipped` が
    # 「満たした」として扱われる罠を持ち込む。`gh pr view` を1回叩くだけで軽く、
    # 節約する理由が無い）。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: pnpm check:pr-line-number-citations
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_LINE_NUMBER_CITATIONS_PR_NUMBER: ${{ github.event.pull_request.number }}
