# `main` へ入ったコミットのメッセージに attribution トレーラが無いかを見る
# （Issue #1314）。
#
# 🔴 **なぜ `no-attribution-trailers.yml` に足さず、別の workflow にしたか**
#
# あちらの trigger は `pull_request` **1本だけ**であり、それは意図された形である
# （逐語は `grep -Fn -- 'ここでは `pull_request` しか起きない' .github/workflows/no-attribution-trailers.yml`）。
# **`push` を足すと、あの job は required context であるため、PR 側の判定に
# 「push でしか起きない事情」が混ざる。** ⟹ 別の workflow に出す。
# （`no-attribution-trailers.yml` 自身が `ci.yml` の外に出た理由と同じ形である。）
#
# 🔴 **この門は required context にならない。なれない。**
#
# required status check は **PR の head sha に紐づく**。この門は `push` でしか
# 走らないので、PR の sha に結果を持たない。⟹ `.github/required-status-checks.json`
# に足さないこと。**足しても、どの PR も満たせない門になるだけである。**
#
# ⚠️ **⟹ この門は片肺である。**
#
# **Issue #1207（OPEN）が「`main` の post-merge CI が落ちても知らせる経路が repo の
# 中に無く、`release/prod` への夜の反映は `main` の CI を見ていない」と言っている。**
# ⟹ **この門が赤くなっても、いまは誰も気づかない。** それを承知で足している——
# 「気づく経路」を作るのは #1207 の仕事であり、**この workflow では解かない。**
# ⛔ **ここに知らせる配線（Issue を立てる・通知を出す）を足さないこと。** 足すと
# #1207 の設計を先取りすることになる。
#
# ## 引き受けた負債（Issue #1314 に対応）
#
# 1. **気づく経路が無い**（上記。#1207 待ち）
# 2. **予防していない。** GitHub の squash が bot 名義のコミットの author を
#    `Co-authored-by:` として自動で足す、その挙動そのものには触っていない。
#    ⟹ **赤は出るが、入るのは止まらない。** 予防は触る先が GitHub 側の挙動・
#    マージ方式・bot の author 名義のどれかになり、**選択肢が複数あるので別の
#    決定である**（#1314 本文）。
# 3. **既に入っている分は見ない。** 1回の push が持ち込んだ範囲だけを見る——
#    `AGENTS.md`「既に付いている分は履歴として残す。履歴を書き換えない」の射程。
#
# ## 採らなかった案
#
# - **`main` の全履歴を毎回走査する** ⟹ 既存の該当分（実測: SDK 更新のマージ済み
#   24本中22本）で**初回から常に赤**になる。⛔ 常に赤い門は、赤の意味を失う。
#   そして `AGENTS.md` の決定（履歴は残す）と正面から衝突する。
# - **警告に留める（exit 0 のまま出力だけ）** ⟹ 気づく経路が無い（#1207）状況では、
#   **出力は誰も読まない。** 赤でなければ存在しないのと同じである。
# - **push の payload の `commits[]` を読む** ⟹ 件数に上限があり、超えた分が黙って
#   落ちる。⛔ `gh pr list --limit N` と同じ族の罠（core の doc に逐語）。

name: main のトレーラを知らせる

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-commit-trailers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 🔴 **`fetch-depth: 0` を落とさないこと。**
      # `actions/checkout` の既定は `fetch-depth: 1` で、**浅い clone では
      # `before..after` が解けない**（`before` のオブジェクトが手元に無い）。
      # ⟹ 検査は `unreadable`（赤）へ倒れる。**緑へ倒れるより良いが、そもそも
      # 測れていない。** 浅い clone は「全部見た」という報告を静かに偽にする族
      # （`--depth=N` / `gh pr list --limit N`）である。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: pnpm check:main-commit-trailers
        env:
          MAIN_COMMIT_TRAILERS_BEFORE: ${{ github.event.before }}
          MAIN_COMMIT_TRAILERS_AFTER: ${{ github.event.after }}
