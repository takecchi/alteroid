name: release/prod へ反映

# **main へマージしてもデプロイしない。** Railway が見るのは release/prod で、それを
# 動かすのはここだけである。マージとデプロイを切り離すのがこのワークフローの目的なので、
# `push: branches: [main]` を足さないこと — 足すと元に戻る（マージした瞬間に走行中の
# マネージャーと作業者が畳まれる状態へ）。
on:
  schedule:
    # 夜に2回（UTC 13:17 / 19:17 ＝ JST 22:17 / 翌 4:17）。
    #
    # **均等な間隔にしていない。** 間隔は6時間と18時間である。**揃えたいのは間隔では
    # なく「人間が手を動かしている時間帯に器を入れ替えない」ことで**、均等に割ると
    # 12時間離れる以上どちらか一方が必ず日中に来る。だから「不揃いだから」で
    # `0,12` の形へ直さないこと — 直すと昼のデプロイが戻る。
    #
    # **時刻ぴったりを避けている** — GitHub の cron は混み合う時刻ほど遅れる
    # （GitHub 自身がそう案内している）。
    #
    # **設定どおりには発火しない。** このリポジトリでの実測（2026-08-18〜19、6時間
    # 設定だった頃の連続4回）で、発火は設定時刻から40〜97分遅れた。つまり実際に走るのは
    # JST 23〜24時頃と5〜6時頃である。**遅れは日中へ近づく方向にしか効かない**ので、
    # ここを昼寄りへ動かすときは遅れの分を先に引いておくこと。待てないときは下の
    # workflow_dispatch で起こす。
    - cron: '17 13,19 * * *'
  # 次の夜まで待てない場合の口（本番が壊れている / 直した欠陥をいま確かめたい）。
  workflow_dispatch:

# release/prod を動かすためだけに要る。他は要らない。
permissions:
  contents: write

# 定時実行と手動起動が重なっても、release/prod を2つの実行が同時に動かさない。
# 走っている方は止めない（途中で切ると push の途中で終わる）。
concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    steps:
      # **浅いままでよい。** 送るオブジェクトは無い（main の先端は remote に既にある
      # ので、これは ref の書き換えだけである）。浅い clone から ref を push できること、
      # `--force-with-lease` の期待値が手元に無いオブジェクトでも通ることは実測で確認済み。
      #
      # dispatch を別の枝から起こされても押すのは main である（正典は main）。
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: main を release/prod へ反映する
        run: .github/scripts/reflect-release-prod.sh
