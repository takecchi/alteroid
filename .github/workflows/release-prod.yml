name: release/prod へ反映

# **main へマージしてもデプロイしない。** Railway が見るのは release/prod で、それを
# 動かすのはここだけである。マージとデプロイを切り離すのがこのワークフローの目的なので、
# `push: branches: [main]` を足さないこと — 足すと元に戻る（マージした瞬間に走行中の
# マネージャーと作業者が畳まれる状態へ）。
on:
  schedule:
    # 夜に1回（UTC 19:17 ＝ JST 4:17）。
    #
    # **時刻ぴったりを避けている** — GitHub の cron は混み合う時刻ほど遅れる
    # （GitHub 自身がそう案内している）。
    #
    # **設定どおりには発火しない。** このリポジトリでの実測（2026-09-15T19:40Z 観測。
    # 単一 cron へ移った 2026-09-05 以降の `event=schedule` 連続10回）で、発火は設定
    # 時刻から **2時間02分〜3時間16分** 遅れた（中央値 2時間27分）。つまり実際に走るのは
    # **JST 06:19〜07:33** である。**遅れは日中へ近づく方向にしか効かない**ので、
    # ここを昼寄りへ動かすときは遅れの分を先に引いておくこと。待てないときは下の
    # workflow_dispatch で起こす。
    #
    # **⚠️ cron の設定を変えたら、それ以前の実測をここへ残さないこと。** ここには
    # 「40〜97分遅れ ⟹ JST 23〜24時頃と5〜6時頃」と書いてあったが、あれは **6時間ごと
    # だった頃**（2026-08-18〜19）の実測で、単一 cron の実測とは1時間以上ずれる。
    # 2026-09-15、この古い記述を読んだ側が「発火は JST 5〜6時」を前提に段取りを組み、
    # 実際の窓（JST 06:19〜07:33）と食い違った。**古い数字は赤くならないので、
    # 食い違ったことは使う側からは分からない。**
    #
    # **⚠️ 数字そのものも腐る。使う前に測り直すこと**（`workflow_dispatch` を混ぜると
    # 窓が広く見えるので、`event=schedule` の行だけを見る）:
    #
    #   gh run list --repo takecchi/alteroid --workflow=release-prod.yml \
    #     --limit 100 --json createdAt,event,conclusion
    - cron: '17 19 * * *'
  # 次の夜まで待てない場合の口（本番が壊れている / 直した欠陥をいま確かめたい）。
  workflow_dispatch:

# release/prod を動かすためだけに要る。他は要らない。
permissions:
  contents: write

# 定時実行と手動起動が重なっても、release/prod を2つの実行が同時に動かさない。
# 走っている方は止めない（途中で切ると push の途中で終わる）。
concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    steps:
      # **浅いままでよい。** 送るオブジェクトは無い（main の先端は remote に既にある
      # ので、これは ref の書き換えだけである）。浅い clone から ref を push できること、
      # `--force-with-lease` の期待値が手元に無いオブジェクトでも通ることは実測で確認済み。
      #
      # dispatch を別の枝から起こされても押すのは main である（正典は main）。
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: main を release/prod へ反映する
        run: .github/scripts/reflect-release-prod.sh
