name: CI

on:
  push:
    branches: [main]
  pull_request:
    # **`ready_for_review` を明示で足す。** GitHub の既定は
    # `[opened, synchronize, reopened]` で、**`ready_for_review` を含まない。**
    # 下の `ci` / `image` の `if:` は draft の間だけ節約する形にしてあるが、
    # 節約が効くのは「draft → ready の遷移そのものが1回の `pull_request` イベントに
    # なる」ときだけである。既定のままだと、その遷移はどの `types` にも当たらず
    # イベントが起きない ⟹ **draft のときに skip した required チェックの結果が
    # そのまま「まだ走っていない」状態で固定され、ready にしても本物の run が
    # 1本も起きないまま古い（存在しない）結果を待ち続ける。** ここを足し忘れると、
    # 節約の仕組みそのものが「draft のまま一生 skip される」事故に化ける。
    #
    # **この並び自体は、同じオーナーの別 repo（非公開）に在る先例と同じ課題への
    # 答えである**（観測 2026-09-11、read-only で確認しただけで、あちらは1バイトも
    # 変えていない）。⚠️ ここで引くのは**一般化された設計の判断だけ**にとどめる
    # （repo 名・ファイル名・ジョブ名・設定の有無といった中身は、非公開 repo の
    # ものなので書かない）。**書式は真似しない** — この repo は
    # `pnpm format:check`（prettier）が YAML にも掛かるので、角括弧の内側の空白の
    # 有無を含めて prettier が決める形に従う。**`if:` の書き方も意図的に違えて
    # ある**（理由は下の `ci` の `if:` の doc）。**workflow の YAML の構文を守って
    # いるのもこの prettier だけである**（他の歯は文字列で必要な行を拾うだけ）。その
    # 配線は `scripts/workflow-yaml-format-check.test.ts` が固定している。
    types: [opened, synchronize, reopened, ready_for_review]
  # **上流ドリフトを見に行く回。ここだけキャッシュを使わずに焼く**（下の `image` の
  # `no-cache`）。**定時にしてあるのは、PR の門を人質に取らないためである** — `ci` と
  # `image` は required なので（**正本は `.github/required-status-checks.json`。
  # ここに値を書き写さない** —— 写しが2つあると、片方だけ直した回の食い違いが
  # どこからも見えなくなる）、PR ごとに焼き直す形に
  # すると、**上流の apt が落ちている間は1本もマージできなくなる。**
  # 鳴らしたいのは警報であって、門ではない。
  #
  # **時刻は release/prod への反映より前にしてある。** あちらは `cron: '17 19 * * *'`
  # で、実測の発火は 21:19〜22:04Z（観測 2026-09-05〜09、`event=schedule` の5回）。
  # ここを 15:41Z にしておけば、`AGENTS.md` が記録している最大の遅れ（2時間37分）を
  # 足しても 18:18Z ごろには始まるので、**今夜のデプロイの前に鳴る。**
  # 分をずらしてあるのは release-prod.yml と同じ理由である（逐語は
  # `grep -Fn -- '時刻ぴったりを避けている' .github/workflows/release-prod.yml`）。
  schedule:
    - cron: '41 15 * * *'
  # 次の定時まで待てない場合の口（`release-prod.yml` の `workflow_dispatch` と同じ形）。
  workflow_dispatch:

# **同じ PR に続けて push したとき、古い実行を残さない。** 後から押した commit の
# 結果しか見ないのに、前の実行は最後まで runner を占有する。並行して PR を抱えている
# ときはその占有がそのまま他の PR の待ち時間になる。
#
# **キーは「何の実行か」で分ける。**
#
# - `github.head_ref` は pull_request のときだけ値が入る（PR の元ブランチ名）。
#   つまり**同じ PR の実行だけが同じ群に入り、新しい方が古い方を消す**
# - push（main）と、定時実行・手動起動では `head_ref` が空なので `github.run_id` に
#   落ちる。これは実行ごとに必ず違うので、**main の実行はどれも群を共有せず、
#   キャンセルされない**。main の各 commit は release/prod へ写る候補そのもので、
#   「この commit で緑だった」の記録が後続の push で消えると、どの commit まで
#   確かめたかが言えなくなる
#
# **`github.ref` で書かないこと。** pull_request の `github.ref` は `refs/pull/<n>/merge`
# で PR ごとに違うので PR 側は同じように効くが、push 側まで1つの群（`refs/heads/main`）に
# まとまる。`cancel-in-progress: true` と併せると**上の main の性質が消える**。
#
# 走行中を切るのは PR の CI だけである。release/prod（`cancel-in-progress: false`）と
# 逆にしてあるのは、あちらが途中で切れると push の途中で終わるからで、こちらは
# 読み取りと検査しかしないので途中で切れても外に影響が残らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# **上流ドリフトを見に行く回か。** `image` の `no-cache` と `cache-to` をこれで切り替える。
# 判定を1か所に置いてあるのは、2か所に書くと片方だけ直されて食い違うからである。
#
# ⚠️ `<条件> && '' || <値>` の形で書かないこと。**空文字は GitHub 式で falsy なので
# 必ず右へ落ちる。** 下の `cache-to` は「真のときに非空を返す」向きで書いてある。
env:
  DRIFT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

# **無条件（`if:` も `needs:` も持たない）で走る安いジョブは置いていない。**
# 同じオーナーの別 repo（非公開）の先例から引いた**判断の基準**はこれである
# ——「**その門は、PR に紐付かない経路（依存のインストールを経ない clone・
# PR を経由しない直 push）を見ているか。見ているなら条件で狭めてはならない**」。
# ⚠️ **「draft の間 required が skipped になるのを避けるため」ではない**
# （そこを取り違えると、当たらない所へ形だけ運ぶことになる）。狭めた瞬間に
# その経路ごと見えなくなる、というのが基準の中身である。
#
# **alteroid にこの基準を当てると、無条件ジョブは要らない。** `ci` は
# push（main）と workflow_dispatch で、`image` はさらに schedule でも走り
# 続ける——上の `ci` / `image` の `if:` は `pull_request` の枝だけを draft の
# 間だけ狭めており、他のイベントの経路は1ミリも変えていない。⟹ 「PR に
# 紐付かない経路（直 push・手動起動・定時）を見る」役目は、**既存の2ジョブが
# そのまま持っているので、別に無条件ジョブを立てる理由が無い。**
jobs:
  ci:
    # **定時の回は回さない。** あの回が訊いているのは「上流が動いて器が焼けなく
    # なっていないか」だけである。ここまで毎晩回すと、別の主張（依存の更新で単体
    # テストが落ちないか）を黙って足すことになる。手動起動では回す。
    #
    # **draft の pull_request では回さない（重い CI を人質に取らない）。** ただし
    # 条件は「`github.event_name != 'schedule'` の後ろへ draft の判定を足す」形に
    # してあり、**`github.event.pull_request.draft == false` だけを単独では書かない。**
    #
    # 理由 —— `push`（main）・`schedule`・`workflow_dispatch` のどのイベントでも
    # `github.event.pull_request` はそもそも**存在しない**（コンテキストに無い
    # キーは GitHub 式では `null` になる）。GitHub Actions の式は `null == false` を
    # **false** と評価する（`true` ではない）ので、`draft == false` だけを条件に
    # すると、push でも schedule でも `false` になって**この歯が main の CI ごと
    # 消える** —— required チェック（`ci`）が絶対に走らない形で赤くも表示されず、
    # ブランチ保護がただ黙って通ってしまう。**これがいちばん危ない罠である**（push を
    # 何も検査しないまま「緑」にする）。だから先に `github.event_name` で
    # `pull_request` かどうかを分け、**pull_request 以外はこの判定を素通りさせる**
    # （`!= 'pull_request'` の左辺が真になり、右辺の `draft` を評価するまでもなく
    # `||` で true に落ちる）。draft を見るのは「いま本当に pull_request イベントで
    # あるとき」だけである。
    #
    # **⚠️ 同じオーナーの別 repo（非公開）に、この判定を `==` の側で書いた先例が
    # 在る。ここを「先例に揃えよう」と書き換えないこと。** `github.event_name ==
    # 'pull_request' && draft == false` の形が正しくなるのは、**PR 専用ジョブと
    # push 専用ジョブが最初から分かれている**場合である。**この repo の `ci` は
    # push（main）・pull_request・workflow_dispatch の3イベントを1つのジョブで
    # 兼ねている**ので、`==` に書き換えると `push` と `workflow_dispatch` まで
    # 丸ごと skip される——これはまさに直上で説明した罠そのものである（今度は
    # `pull_request` 以外の全イベントが対象になる、より広い形で）。🔑 **どちらが
    # 正しいかは、そのジョブが*どのイベントを兼ねているか*で決まる。** `!=` で
    # 「pull_request 以外は素通りさせる」形を維持しているのは、先例を知らなかった
    # からではなく、**知ったうえで意図的に違えている。**
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Node と pnpm の版は mise.toml が持つ（ローカルと同じものを使う）
      - uses: jdx/mise-action@v4
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile

      # **AGENTS.md のバイト数にラチェットを置く歯（Issue #1192）。** 静的検査
      # （ビルド済み成果物を読まない）なので、`pnpm build` より前に置く——
      # 落ちるなら他の重い検査より先に、速く落ちるべきである。
      #
      # **`pnpm verify`（`scripts/verify-core.mjs` の STEPS）には足していない。**
      # あちらは #1191 で別の担当が改修中で、この PR ではその中身を1バイトも
      # 変えない分担にしてある。verify への組み込みは #1191 が着地した後の
      # 別便にする——いまはこの ci.yml の1行だけが門である。
      - run: pnpm check:agents-md-size

      - run: pnpm build

      # **`apps/web` の生成物に Node 専用の痕跡が無いことを見る（結果側の歯）。**
      # `@alteroid/core`（サーバ専用のドメイン層まで丸ごと再エクスポートするバレル）
      # から**値**を import すると、そのコードごとブラウザバンドルへ入る事故が実際に
      # 起きた（#294 / #306。`commitments` ルートのチャンクが 1.2MB に膨らみ、
      # `node:module` の `createRequire` 呼び出しがブラウザでのモジュール評価
      # 時点で例外を投げて、本番で一度も開けなくなった）。
      #
      # `eslint.config.js` の `@typescript-eslint/no-restricted-imports` が
      # 同じ事故の**入口**（`@alteroid/core` からの値 import）を塞ぐが、経路を
      # 固定した歯なので、別の依存から同じ形の混入が起きたら鳴らない。この検査は
      # 経路を問わず**生成物そのもの**を見るので、原因が何であっても捕まえる。
      # 検査語の選び方・言えないことは `scripts/check-web-bundle-node-traces.mjs` の
      # doc を見よ。
      - run: pnpm check:web-bundle-node-traces

      # **`apps/web` の生成物のバイト数が閾値を超えていないことを見る（大きさ側の歯）。**
      # 上の歯（node-traces）と `eslint.config.js` の import 制限は、どちらも
      # 「事故の原因（サーバ専用コードの混入）」を見る歯である。別の原因で
      # チャンクが膨らんだら、どちらも鳴らない。この検査は原因を問わず
      # **大きさそのもの**を見る3本目の歯であり、`/commitments` のチャンクが
      # 1,198,608 B に膨れて本番で開けなくなった事故そのもの
      # （https://github.com/takecchi/alteroid/issues/335）が再発すれば必ず捕まえる。
      # 閾値の根拠・言えないことは `scripts/check-web-bundle-size.mjs` の doc を見よ。
      - run: pnpm check:web-bundle-size

      # **`apps/web` の生成物の CSS に、コメントの誤拾いで生まれた不正な宣言が
      # 入っていないことを見る（もう1つの結果側の歯）。**
      #
      # Tailwind のスキャナはソースコードの「コメントの中」に書かれたクラス名も
      # 拾う。省略記号などのプレースホルダを混ぜたコメント（`pr-[calc(...+
      # var(--safe-right))]` など）を書くと、コンパイル後の CSS に
      # `padding-right:calc(...+var(--safe-right))` という不正な宣言がそのまま
      # 出る事故が実際に起きた（#317）。不正な宣言はブラウザが黙って捨てるので、
      # 画面には何も起きない。検査語の選び方・言えないことは
      # `scripts/check-web-css-comment-classnames-core.mjs` の doc を見よ。
      #
      # **この検査は #317 で入ったが、`check:web-css-comment-classnames` は
      # package.json にしかなく、`scripts/verify.mjs`（実体は `verify-core.mjs`
      # の STEPS）にも ci.yml にも呼ばれていなかった。在るのに効いていない道具は、
      # 静かに失敗する（`AGENTS.md`「静かに失敗する道具」— #646 の
      # `check:sdk-quotes` と同じ形の穴だった）。**
      - run: pnpm check:web-css-comment-classnames

      # **コードと OpenAPI spec がずれたまま気づかない状態を作らない。**
      # spec は経路の zod スキーマから機械生成され、`pnpm build` が毎回書き直す。
      # つまりここに差分が出るのは「コードを変えたのに commit した spec が古い」
      # ときだけである。手書きの spec を別に置いて二重管理にしないための検査であり、
      # 人間に「先に生成コマンドを流す」手順を足さないための場所でもある（Issue #20）。
      #
      # **この検査が言えること / 言えないこと。** 守りたいのは
      # `docs/PRD.md`「要件: インターフェース（CLI・HTTP API・Web UI）」— **画面の都合で
      # API に経路を足さない**（足した瞬間に「CLI ではできないこと」が生まれる）。
      # ここが見ているのは、その要件のうち**機械で見える一部だけ**である。
      #
      # - **言えること**: commit 済みの `openapi.json` が、いまのコードから生成される
      #   ものと一致している（spec が古くない）。経路やスキーマを変えたのに spec を
      #   commit し忘れた、が通らない
      # - **言えないこと**: 足された経路が**画面のためのものかどうか**。ここは
      #   「spec が最新か」しか見ないので、`apps/web` の都合で経路を1本足して
      #   `pnpm build` して spec も一緒に commit すれば、**この検査は緑のまま通る**
      #
      # **だから入口の等価性を「CI が守っている」と読まないこと。** 守っているのは
      # 二重管理の防止であって、等価性ではない。等価性（CLI でできないことを作らない）
      # を守っているのは、いまのところ**レビューだけ**である
      # （`docs/PRD.md`「要件: インターフェース」、`AGENTS.md`「実装の前提」）。
      #
      # **参照先を上位文書にしてあるのは意図である。** ここは以前 roadmap の受け入れ基準を
      # 指していたが、roadmap は動く文書で、実際にその基準は 2026-08-21 の削除で消えた。
      # **要件は PRD と north_star に在る。新しく書く参照は上位を指す。**
      #
      # 計器の側に「この数字が言えないこと」を貼ってあるのは、#129 / #131 と同じ形で
      # ある。**言えないことを書いていない計器は、読む側が言えると思い込む。**
      - name: OpenAPI spec がコードと一致しているか
        run: |
          git diff --exit-code -- apps/daemon/openapi.json || {
            echo "::error::apps/daemon/openapi.json が古い。pnpm build して差分をコミットすること" >&2
            exit 1
          }

      # **同梱 SDK から逐語で引いたコメントが、いまの版でも逐語であることを当てる。**
      # 引き写した先はこの repo のソースなので、SDK の版を上げても差分には出ない —— #639
      # （0.3.259 → 0.3.261）は lock と catalog の2ファイルだけで、それでも
      # `agent-events.ts` の逐語は同じ更新で嘘になった（#646）。**引用は外の版に依存して
      # おり、依存はコンパイラにもレビューにも見えない。**
      #
      # **この検査は #646 で入ったが、どの門からも呼ばれていなかった**（`package.json` に
      # script は在り、`scripts/verify-core.mjs` の STEPS にも ci.yml にも無かった）。
      # 在るのに効いていない道具は、静かに失敗する（`AGENTS.md`「静かに失敗する道具」）。
      - run: pnpm check:sdk-quotes

      # **世代ずれの起こし直しの助言の生成元を1つに保つ歯（Issue #1175）。**
      # `scripts/verify-core.mjs` の STEPS にも在るが、**STEPS だけでは PR の CI で
      # 一度も走らない** —— この job は `pnpm verify` を呼ばず、門を1本ずつ並べる形
      # だからである。`scripts/check-scripts-wired.test.ts` は「STEPS か workflow の
      # どちらかに在る」ことしか見ないので、STEPS にだけ足すと**配線済みとして緑を
      # 返しながら、main へ7箇所目が入るのを止められない**。直上の `check:sdk-quotes`
      # がまさに同じ穴で（#646。実装から配線まで期間が空いた）、そのときの断りが
      # このすぐ上に逐語で残っている。
      #
      # ⚠ `scripts/check-stale-token-restart-advice.test.ts` は純関数を合成入力で
      # 測るだけで、`check-sdk-quotes.test.ts` のような「実物の検査」describe を
      # 持たない。⟹ `pnpm test` 経由でも実物の repo には当たらない。**実物へ当たる
      # 経路はこの1行だけである。**
      - run: pnpm check:stale-token-restart-advice

      # **逆向きの助言（「確かめる前に manager_start で起こし直すな」）の生成元を
      # 1つに保つ歯（Issue #1287）。** 直上の `check:stale-token-restart-advice`
      # （#1175）とまったく同じ理由・同じ配線の形——`scripts/verify-core.mjs` の
      # STEPS だけでは PR の CI で一度も走らない（この job は `pnpm verify` を
      # 呼ばず、門を1本ずつ並べる形だからである）。**実物へ当たる経路はこの1行
      # だけである**（`scripts/check-restart-before-check-advice.test.ts` は純
      # 関数を合成入力で測るだけで、実物の repo には当たらない）。
      - run: pnpm check:restart-before-check-advice
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      # **変異試験ハーネスの自己検査（#1096）。** 本体の変異試験ではなく、
      # `mutate-selftest.mjs` のシナリオ（ハーネス自身の受け入れ条件と、
      # レビューで見つかった欠陥の回帰確認）だけを回す。
      #
      # **なぜ足したか。** `SELFTEST_SCENARIOS` はどの門からも呼ばれておらず、
      # **シナリオが腐っても誰も赤くならなかった。** 実際に `weak-tooth` が
      # 壊れたまま通っていた —— PR #1026（`98fb25a`、2026-09-15T16:37Z）が
      # シナリオの指す文言と実装の間へ別の式を割り込ませたが、**その PR は
      # 緑のまま着地した。** 見つかったのは、別件（#993）の作業で誰かが手で
      # `selftest` を打ったからである（#1096 の起票は 2026-09-16T12:04Z）——
      # **門が見つけたのではない。**
      # **在るのに効いていない道具は静かに失敗する**（`AGENTS.md`「静かに失敗する
      # 道具」。この節のすぐ上の `check:sdk-quotes` がまったく同じ理由で足された）。
      #
      # **⚠️ 変異試験の本体（`mutate.mjs run`）は回していない。** あちらは対象ごとに
      # vitest を丸ごと走らせるので CI に載る重さではない。ここで回すのは
      # ハーネスの自己検査だけである。
      #
      # **重さの実測（2026-09-16、この repo・この器で全11シナリオを1本ずつ計測）**:
      # backup-corruption 0s / weak-tooth 2s / interrupted 1s /
      # interrupted-wrong-order 0s / delivery 16s / judgement-id-integrity 8s /
      # rebuild-failure 10s / spec-validation 0s /
      # judgement-forbidden-word-boundary 18s / restore-status-comparison 0s /
      # judgement-undelivered-gate 0s ⟹ **合計およそ55秒。**
      # **`--scenario all`（CI が実際に打つ形）を通しで1回**、この枝の中身で
      # 測り直した: **52秒・exit 0・ツリーは clean・印も残っていない**（2026-09-16）。
      # 同じ日に測った `ci` ジョブの所要は中央値 542 秒 / 最大 581 秒
      # （直近の run 10本のうち、ジョブが実際に走った8本）なので、**増分はおよそ
      # 1割**である。⚠️ 実測は手元の器のものなので、runner での秒数は別に測ること。
      #
      # **最後に置く理由。** シナリオは走行中に自分専用の使い捨てフィクスチャ
      # （`weak-tooth` / judgement系2本 / `delivery` / `rebuild-failure` がそれぞれ
      # 書く一時ファイル）を変異させて戻し、`restore-status-comparison` は git の
      # index も一時的に動かす。**戻し損ねたときに他の検査を巻き込まない**位置は
      # ここである（戻せているかはシナリオ自身が 12b/12c/12d で見る）。
      # **⚠️ 以前ここは「実ソース（`packages/core/src/excerpt.ts`）へ変異を当てる」
      # と書いていたが、それは #1166 面1（下記）が入る前の状態である。** いまは
      # `--scenario all` が対象にするファイルのどれも実ソースではない（逐語は
      # `grep -Fn -- 'file: FIXTURE_REL' .claude/skills/mutation-testing/mutate-selftest.mjs`
      # や `grep -Fn -- 'DELIVERY_FIXTURE_MODULE_REL =' .claude/skills/mutation-testing/mutate-selftest.mjs`
      # で確認できる）。
      #
      # **⚠️ `pnpm verify` の STEPS には足していない。** あちらが回るのは編集中の
      # ツリーである。#1166 で `judgement-id-integrity` / `judgement-forbidden-word-boundary`
      # は実ソース（`apps/cli/src/conversations.ts`）から使い捨てフィクスチャへ
      # 切り離した（`weak-tooth` と同じ型 —— #1119）。**`delivery`（と、Issue が
      # 名指ししていなかったが同じ形の `rebuild-failure`）は、当時は測った結果
      # あえて切り離さずに残していた** —— `target: '@alteroid/core'` で dist 到達
      # そのものを測るシナリオなので、フィクスチャ化には dist を生む実 entry
      # （`packages/core/src/index.ts` の barrel か `tsup.config.ts` の
      # entry 一覧）を一時的に書き換える足場が要り、weak-tooth のような
      # 「新規ファイルの読み書きだけで閉じる」孤立が効かない（#1166 で実測——
      # 使い捨てマーカーを `index.ts` へ一時的に足せば dist へ届くことは
      # 確認できたが、共有の barrel を足場にする分だけ weak-tooth より
      # リスク・複雑さが増える）。**その後 #1166 面1（PR #1328, squash `c5246f0`）が
      # この barrel 足場を実装し、`delivery` / `rebuild-failure` とも切り離した。**
      # ⟹ `packages/core/src/excerpt.ts` への実ソース依存は消えた——2本とも
      # いまは使い捨てフィクスチャ（`packages/core/src/mutation-selftest-delivery-fixture.ts`）
      # を変異させる（逐語は `grep -Fn -- 'DELIVERY_FIXTURE_MODULE_REL =' .claude/skills/mutation-testing/mutate-selftest.mjs`）。
      # 加えて `scripts/verify.mjs` は「走行中にツリーが動いた」ことを検出して
      # 記録を捨てる作りで、このハーネスは**意図的にツリーを動かす**。**この組み合わせは
      # 2026-09-20 に測って解けた** —— `scripts/verify-core.mjs` の `fingerprint` を
      # 実物のまま呼んで前後を取ると、**正常終了（exit 0）なら指紋は前後で完全に一致する**
      # （素の clone `d963f51`、`--scenario all` の所要 1分46秒）。`verify.mjs` が
      # 突き合わせるのは走る前と走った後の2点だけなので、**往復して戻る限り記録は
      # 捨てられない。** ⚠️ この秒数も手元の器の1回の実測であり、上の 52 秒
      # （2026-09-16）とは倍近く違う。**どちらも規範ではない。**
      #
      # **⟹ それでも STEPS には足さない。** 2026-09-20 の測定時点では理由が2つ
      # 残っており、**1つは測って初めて見つかったものである**（測定の詳細と
      # 再現手順は #1166 のコメント）。**そのうち理由1は #1166 面1（PR #1328）で
      # 解けた。残っているのは理由2（#1262）の1つである。**
      #
      # 1. 上の実ソース依存が健在である（2026-09-20 に再現）。`excerpt.ts` の
      #    言い回しを書き直しただけで `歯3/6 違反: 一致件数が期待と不一致（実際 0 /
      #    期待 1）` が出て exit 1 になる ＝ その文言を触っている最中の人に無関係な赤。
      #    ⚠️ **訂正（2026-09-23）: この理由はもう健在ではない。** #1166 面1
      #    （PR #1328, squash `c5246f0`）が `delivery` / `rebuild-failure` を
      #    barrel 足場つきの使い捨てフィクスチャへ切り離し、実ソース依存を消した。
      # 2. **⭐ signal で中断すると、変異が実ソースに残る**（2026-09-20 に実測。
      #    Issue #1262 として起票済み・未解決）。当時の実測は `delivery` /
      #    `rebuild-failure` が実ソースを対象にしていた版のもので、変異区間で
      #    `kill -INT` を当てると `packages/core/src/excerpt.ts` に
      #    `SELFTEST_MUTATED` が残った。**復元の手がかり
      #    （`MUTATION-IN-PROGRESS.json` / `.mutation-testing/backups/`）は
      #    どちらも ignore 済みなので `git status` にも指紋にも現れない**という
      #    形の欠陥そのもの（`mutate-selftest.mjs` に signal ハンドラが無い）は
      #    #1166 面1 でも直していない——PR #1328 は「build が丸ごと失敗する」形は
      #    測ったが、signal（SIGINT/SIGTERM）による中断は測っていないと自ら
      #    書いている。印だけが残ると、次の1回が `backup-corruption: 印が既にある`
      #    で無関係に即死する。**CI は Ctrl-C を打たないが、手元の人は打つ。**
      #    `pnpm verify` の看板は「**通し直しを無料にする**」ことなので、
      #    中断が次の1回を赤くする手順は、この口と正面から衝突する
      #    （逐語は `grep -Fn -- '警告を足すのではなく、通し直しを無料にする' scripts/verify.mjs`）。
      #    **⟹ 理由が1つに減っただけで、STEPS へ足さないという結論そのものは
      #    変わっていない。**
      #
      # **次の一手（#1166 本文の指定）:** Issue #1166 本文は「面1が片付けば
      # （実ソース依存が消えれば）1つ目の理由は消えるので、面1の後に測り直すのが
      # 順序として素直である」と書いている。面1は上記のとおり片付いた。⟹ 次に
      # やるとすれば、この STEPS 追加の可否を測り直すことである——ここではまだ
      # 測り直していない（決めるのはこのコメント更新の範囲外）。
      - run: node .claude/skills/mutation-testing/mutate.mjs selftest --scenario all

  # イメージもここで焼く。**マネージャーの道具は版を固定していない**（人間の手元より
  # 古い `gh` を配らないため）ので、上流が変わって壊れたことに気づく場所が要る。
  # ここが無いと、気づくのがデプロイ時になる。
  #
  # 焼くのは runtime ステージ = 実際に走る器そのものである。amd64 だけ焼く
  # （Railway と同じ。アーキテクチャ差は apt の `dpkg --print-architecture` 任せに
  # してあるので、arm64 固有の分岐はもう無い）。
  image:
    # **draft の pull_request では焼かない。** `ci` の直上に書いた理由（`push` /
    # `schedule` / `workflow_dispatch` では `github.event.pull_request` が存在せず
    # `null == false` は偽になるので、`draft == false` 単独では書けない）が
    # そのまま当てはまる。**ただし schedule はここでは除外しない** — 上の `env.DRIFT`
    # /「上流ドリフトを見に行く回」がこのジョブに要求している役目（`ci` とは違い、
    # `image` は定時でも走り続けて上流の apt/イメージの崩れを見張る）は変えない。
    # ⟹ `ci` の条件から `github.event_name != 'schedule'` の項だけを抜いた形にする。
    #
    # **`!=` を使う理由（先例と意図的に違えている理由）は `ci` の if: の
    # doc に書いた——ここでも同じ理由がそのまま当てはまる。** `image` は
    # push・pull_request・schedule・workflow_dispatch の4イベントを1つの
    # ジョブで兼ねているので、`==` の形にすると `pull_request` 以外の全
    # イベント（push を含む）が skip される。ここも「先例に揃えよう」で
    # 書き換えないこと。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: alteroid:ci
          # クローンの自己認識に載るリビジョン。**ビルド文脈に `.git` は入れない**
          # ので、渡さないと「リビジョン不明」の器が焼ける。不明でも壊れないが、
          # 自分が走っているコミットを言えるかどうかは調べ物の精度に直結する。
          build-args: |
            ALTEROID_BUILD_REV=${{ github.sha }}
          cache-from: type=gha
          # **定時の回はキャッシュを書き戻さない。** 書き戻すと翌日の PR の `image` が
          # その層で焼かれることになり、上流が動いた日に**無関係な PR が赤くなる**
          # ＝ 上の `schedule` で避けたはずの「門を人質に取る」がそのまま戻ってくる。
          cache-to: ${{ env.DRIFT != 'true' && 'type=gha' || '' }}
          # **このジョブが自分で名乗っている役割は、ここが無いと果たされない**（逐語は
          # `grep -Fn -- '上流が変わって壊れたことに気づく場所が要る' .github/workflows/ci.yml`）。
          # 実測（観測 2026-09-10T06:57Z、`main` の run 34447496931 の `image` ジョブの
          # ログ）: `apt-get install … git ripgrep jq gh tini` の層は `#22 CACHED` で、
          # **一度も走っていなかった。** ベースの digest と Dockerfile の本文が変わらない
          # 限り再実行されないので、`gh` の apt リポジトリ側だけが動いても気づけない。
          #
          # **この回が言えること / 言えないこと。**
          #
          # - **言えること**: いまの上流で、この Dockerfile が素から焼けるか。焼けた
          #   イメージが下の実挙動の歯を通るか
          # - ⚠️ **言えないこと(1): 今夜 Railway が何を焼くか。** Railway は
          #   `railway/daemon.json` / `railway/runner.json` の `builder: DOCKERFILE` で
          #   **自分でもう一度焼く**ので、層のキャッシュもこちらとは別物である。実測
          #   （観測 2026-09-10T08:24Z、走っている runner の中から）: 本番の器の
          #   `/usr/bin/gh` は `2.98.0`（ファイルの日付 2026-08-20）で、同じ時刻に
          #   `https://cli.github.com/packages/dists/stable/main/binary-amd64/Packages`
          #   が配っていたのは `2.100.0` だった。⟹ `Dockerfile` の
          #   `grep -Fn -- 'その時点の版が入るようにしてある' Dockerfile` は、**層の
          #   キャッシュが在るあいだ成り立たない**
          # - ⚠️ **言えないこと(2): これは警報であって門ではない。** ここが赤くても夜の
          #   反映は止まらない（逐語は
          #   `grep -Fn -- 'SHA が違えば push する。それだけである。' .github/scripts/reflect-release-prod.sh`）
          no-cache: ${{ env.DRIFT == 'true' }}

      # **マネージャーが実際に走る主体（uid 1001）で見る。** root で揃っていても、
      # 降りた先で欠けていれば「コンテナだからできない」が生まれる（north_star 禁止1）。
      - name: マネージャーの道具が揃っているか
        run: |
          docker run --rm -u 1001 alteroid:ci sh -eu -c '
            for t in git gh jq rg curl node pnpm alteroid; do
              command -v "$t" >/dev/null || { echo "道具が無い: $t" >&2; exit 1; }
            done
            gh --version
            git --version

            # git が資格情報を gh から借りる配線。鍵は焼かないが、経路は焼く。
            helper=$(git config --get-urlmatch credential.helper https://github.com/x/y)
            test "$helper" = "!gh auth git-credential" \
              || { echo "credential helper が違う: $helper" >&2; exit 1; }

            # 鍵が無くても公開リポジトリの clone は通る（無い状態が壊れていないこと）。
            cd /tmp && git clone --depth 1 -q https://github.com/cli/cli.git probe
          '

      # **Issue #965 段2。「入れた」で終わらせない。** パッケージが apt の依存解決を
      # 通ることと、initdb して拡張が実際に使えることは別の主張である。ここで
      # 使い捨てのクラスタを立て、`CREATE EXTENSION vector` まで確かめる。
      #
      # **⚠️ `-u 1001` で走らせる。root でも `postgres` システムユーザーでもない。**
      # `1001` は `Dockerfile` の `ENV ALTEROID_RUNNER_CHILD_UID`（`useradd --uid
      # 1001 ... worker`）そのもので、この repo でマネージャー・作業者が実際に
      # 走る主体と同じ値である（このジョブの直前のステップ「マネージャーの道具が
      # 揃っているか」も同じ `-u 1001` を使っている）。**最初の実装は `-u 0` +
      # `su postgres` で通していたが、それは作業者が自分の器で postgres を
      # 立てられることを1文字も証明していなかった**（作業者は root でも
      # `postgres` でもなく `worker`／uid 1001 で、`su` も使えない）。
      # ⟹ 作業者と同じ非 root uid のまま、自分の作業ディレクトリへ直に
      # `initdb` することを見る形に直した。`initdb` は root では動かないので、
      # 非 root で直に叩くほうがむしろ素直である。
      #
      # データディレクトリはイメージへ焼かず、この使い捨てコンテナの `/tmp`
      # （uid 1001 が書ける）に都度作る。
      #
      # **`pids.current` も同じ実行の中で before/after を取る**（#965 の3つ目の
      # 条件 — postgres を立てた状態でもう一度測ること）。⚠️ **ここは GitHub
      # Actions の runner であって、alteroid が実際に走っている Railway の
      # runner ではない。** #965 段1・その派生コメントが測った `pids.max=1000`
      # の cgroup とは別物なので、この2つの絶対値をそちらの余り（716）と比べない
      # こと —— 比べてよいのはこの実行の中の「差分」だけである。**あの実測は
      # コンテナ全体のもので、他テナントが軽い時間帯の観測である**という段1の
      # 但し書きもそのまま生きている。
      - name: 使い捨て postgres で CREATE EXTENSION vector が通るか（作業者と同じ uid 1001 / 非 root、+ pids の before/after）
        run: |
          docker run --rm -u 1001 alteroid:ci sh -eu -c '
            export PATH=/usr/lib/postgresql/17/bin:$PATH
            PGDATA=/tmp/pgdata-ci

            if [ -r /sys/fs/cgroup/pids.current ]; then
              echo "pids.current(postgres起動前、このコンテナ内、GitHub Actions runner): $(cat /sys/fs/cgroup/pids.current)"
              [ -r /sys/fs/cgroup/pids.max ] && echo "pids.max(同上): $(cat /sys/fs/cgroup/pids.max)"
            else
              echo "pids.current: このコンテナには /sys/fs/cgroup/pids.current が無い(cgroup v2 未使用か、権限が無い)"
            fi

            mkdir -p "$PGDATA"
            initdb -D "$PGDATA" --auth=trust \
              || { echo "initdb が失敗した" >&2; exit 1; }
            pg_ctl -D "$PGDATA" -l /tmp/pg.log -o "-k /tmp -h 127.0.0.1 -p 5433" start \
              || { echo "pg_ctl start が失敗した:" >&2; cat /tmp/pg.log >&2; exit 1; }

            if [ -r /sys/fs/cgroup/pids.current ]; then
              echo "pids.current(postgres起動後、このコンテナ内、GitHub Actions runner): $(cat /sys/fs/cgroup/pids.current)"
            fi

            psql -h 127.0.0.1 -p 5433 -d postgres -c "CREATE EXTENSION vector;" \
              || { echo "CREATE EXTENSION vector が失敗した:" >&2; cat /tmp/pg.log >&2; pg_ctl -D "$PGDATA" stop || true; exit 1; }
            psql -h 127.0.0.1 -p 5433 -d postgres -c "SELECT extname, extversion FROM pg_extension;"

            pg_ctl -D "$PGDATA" stop
          '

      # **「渡したつもり」で終わらせない。** 上のビルドで `ALTEROID_BUILD_REV=
      # github.sha` を渡したが、それが実際に焼き込まれ、`resolveBuildRevision()`
      # が `commit === github.sha` かつ `source === 'build'` を返すことまで見る。
      # 渡した build-arg が握りつぶされていても、ここが無ければ気づけない。
      - name: 焼いたイメージが github.sha を実際に名乗るか
        run: |
          docker run --rm -u 1001 -e GITHUB_SHA="${{ github.sha }}" alteroid:ci node -e '
            import("/app/packages/core/dist/index.js").then(({ resolveBuildRevision }) => {
              const rev = resolveBuildRevision();
              const expected = process.env.GITHUB_SHA;
              if (rev.commit !== expected || rev.source !== "build") {
                console.error(
                  "焼き込みが github.sha を名乗っていない: " + JSON.stringify(rev) +
                    "（期待: commit=" + expected + ", source=build）",
                );
                process.exit(1);
              }
              console.log("ok: " + JSON.stringify(rev));
            }).catch((error) => { console.error(error); process.exit(1); });
          '

      # **鍵が凍らないこと。** env で配ると、鍵は runner の起動時に固定され、走行中の
      # マネージャーには永久に届かない（「鍵を直す」と「走行中の仕事を失う」が同じ
      # 操作になる）。`gh` が毎回ファイルを読むこと自体をここで見る。手元で壊れたことに
      # 気づける場所が他に無い。
      - name: 鍵が走行中に差し替えられるか（gh がファイルを読み直す）
        run: |
          docker run --rm -u 1001 alteroid:ci sh -eu -c '
            f=/tmp/gh-token
            export ALTEROID_GH_TOKEN_FILE="$f"

            # シムが実体より先に見つかること（PATH の順序が崩れていないこと）
            test "$(command -v gh)" = /usr/local/bin/gh \
              || { echo "gh のシムが効いていない: $(command -v gh)" >&2; exit 1; }

            printf %s "token-one" > "$f"
            gh auth token 2>/dev/null | grep -qx "token-one" \
              || { echo "1回目の鍵を読めていない" >&2; exit 1; }

            # **同じプロセス環境のまま**中身だけ差し替える（走行中の差し替えを模す）
            printf %s "token-two" > "$f"
            gh auth token 2>/dev/null | grep -qx "token-two" \
              || { echo "差し替えた鍵が届いていない（凍っている）" >&2; exit 1; }

            # 空の鍵は「置かれていない」と同じ扱い（空を export すると壊れ方が悪化する）
            : > "$f"
            gh auth token >/dev/null 2>&1 \
              && { echo "空の鍵が鍵として通っている" >&2; exit 1; }
            exit 0
          '

      # **人間が置く値は app と runner で同じ。** その楽さと引き換えに守りが落ちて
      # いないことを、器そのもので見る（docs/architecture.md「制御面の保護」3枚目）。
      # ここが落ちたら、直すのは運用手順ではなく `docker/alteroid-runner` である。
      - name: 走っている runner に素の合鍵が残らないか
        run: |
          docker run --rm -u 0 -e ALTEROID_RUNNER_TOKEN=raw-secret -e ALTEROID_RUNNER_PORT=4518 \
            alteroid:ci sh -eu -c '
              alteroid-runner &
              sleep 3

              # 見るのは**走っているプロセスの環境**。ここに素の値が残ると、UID の分離が
              # 崩れた場面で子プロセスが /proc から読める。
              tr "\0" "\n" < /proc/$!/environ | grep -q "^ALTEROID_RUNNER_TOKEN=" \
                && { echo "素の合鍵が残っている" >&2; exit 1; }
              tr "\0" "\n" < /proc/$!/environ | grep -q "^ALTEROID_RUNNER_TOKEN_SHA256=" \
                || { echo "sha256 へ畳めていない" >&2; exit 1; }

              # 畳んでも本人確認は成立する（鍵が無ければ 401、同じ値なら通る）
              test "$(curl -s -o /dev/null -w %{http_code} http://127.0.0.1:4518/managers)" = 401 \
                || { echo "鍵なしで制御面が通った" >&2; exit 1; }
              test "$(curl -s -o /dev/null -w %{http_code} -H "authorization: Bearer raw-secret" \
                http://127.0.0.1:4518/managers)" = 200 \
                || { echo "デーモンと同じ値で通らない" >&2; exit 1; }
            '

      # 入口の認証（ログイン）の鍵も、人間は共有の1か所に置く。**走っている runner が
      # それを持っていないこと**を器そのもので見る（合鍵とまったく同じ理由 — 読めた
      # 瞬間、マネージャーが自分でアクセストークンを発行して記憶へ届く）。
      #
      # 同時に、**下＝外の世界へ手を伸ばす鍵は落ちていないこと**も見る。ここを一緒に
      # 見ないと、「危なそうな名前を全部消す」方向へ倒れて `gh pr create` が層を
      # 下りた瞬間にできなくなる（デグレード。north_star 禁止1）。
      - name: 走っている runner にログインの鍵が残らないか（GH_TOKEN は残ること）
        run: |
          docker run --rm -u 0 \
            -e ALTEROID_RUNNER_TOKEN=raw-secret -e ALTEROID_RUNNER_PORT=4519 \
            -e ALTEROID_GOOGLE_CLIENT_ID=client-id \
            -e ALTEROID_GOOGLE_CLIENT_SECRET=client-secret \
            -e GH_TOKEN=gh-secret \
            alteroid:ci sh -eu -c '
              alteroid-runner &
              sleep 3
              env_of() { tr "\0" "\n" < /proc/$1/environ; }

              for key in ALTEROID_GOOGLE_CLIENT_ID ALTEROID_GOOGLE_CLIENT_SECRET; do
                env_of $! | grep -q "^$key=" \
                  && { echo "ログインの鍵が残っている: $key" >&2; exit 1; }
              done

              # 逆に、外の世界へ手を伸ばす鍵は**渡っていること**
              env_of $! | grep -q "^GH_TOKEN=" \
                || { echo "GH_TOKEN まで落ちている（デグレード）" >&2; exit 1; }
              exit 0
            '

      # デーモンは記憶ストアの鍵を持つ。**root で起こされても特権のまま走らない。**
      # （Railway は実行 UID を環境変数で決めるので、root で来る構成がありうる）
      #
      # **UID だけを見ても足りない。** `setpriv` は環境を変えないので、`HOME=/root` の
      # まま降りると uid は正しいのにクローンの SDK セッションが設定を書けずに落ちる
      # （「コンテナだからできない」＝north_star 禁止1）。降りた先で**実際に書けること**
      # まで見る。
      - name: デーモンは root で起こされても node へ降りるか（HOME ごと）
        run: |
          docker run --rm -u 0 alteroid:ci sh -eu -c '
            alteroidd &
            pid=$!
            sleep 3

            uid=$(awk "/^Uid:/ {print \$2}" /proc/$pid/status)
            test "$uid" = 1000 || { echo "root のまま走っている: uid=$uid" >&2; exit 1; }

            # 環境は**同じ主体からしか読めない**（docker の既定に CAP_SYS_PTRACE は
            # 無いので、root でも降りた先のプロセスは覗けない）。node で読む。
            home=$(su -s /bin/sh node -c "tr \"\\0\" \"\\n\" < /proc/$pid/environ" | sed -n "s/^HOME=//p")
            test "$home" = /home/node || { echo "HOME が降りていない: $home" >&2; exit 1; }

            # 降りた先の主体で、その HOME 配下へ実際に書けること
            su -s /bin/sh node -c "mkdir -p \"$home/.claude\" && touch \"$home/.claude/probe\"" \
              || { echo "降りた先で HOME へ書けない" >&2; exit 1; }
          '

      # **別 UID の子プロセスは runner の制御面ソケットへ繋げないことを実物で見る。**
      # `apps/runner/src/boundary.test.ts`（vitest）はこれを in-process では確かめ
      # られない — vitest プロセスは非 root で `CAP_SETUID` を持たず、`pnpm test` が
      # 走るどの環境でも別 UID の子プロセスを起こせない。ここでは器そのものの中で
      # UID を実際に分けた2プロセスを走らせ、docs/architecture.md「制御面の保護」
      # 2枚目（ソケットは mode 0600・所有者は uid 1000 のデーモン。別 UID の uid 1001
      # ＝マネージャー子プロセスの主体は connect できない）を直接見る。
      - name: 別 UID の子プロセスは runner の制御面ソケットへ繋げないか
        run: |
          docker run --rm -u 0 \
            -e ALTEROID_RUNNER_TOKEN=raw-secret \
            -e ALTEROID_RUNNER_SOCKET=/run/alteroid/runner.sock \
            -e ALTEROID_RUNNER_SOCKET_UID=1000 \
            -e ALTEROID_RUNNER_SOCKET_GID=1000 \
            alteroid:ci sh -eu -c '
              mkdir -p /run/alteroid
              alteroid-runner &
              sleep 3

              # **2つの主体が本当に別 UID かを、繋ぐ前に名乗らせる。** ここが無いと、
              # 片方の `su` の宛先を取り違えても検査は緑にも赤にもなりうるが、
              # どちらの場合も**使われていない UID の名前で結果を報告する**。実測で
              # その形を作った（下の「歯の確認」参照）: 両方を node にすると、失敗
              # メッセージは「別 UID(uid 1001)から繋がってしまった」と出たが、uid 1001
              # は一度も走っていなかった。**計器が嘘をつく形なので、計器の側で塞ぐ。**
              owner_uid=$(su -s /bin/sh node -c "id -u")
              other_uid=$(su -s /bin/sh worker -c "id -u")
              test "$owner_uid" = 1000 \
                || { echo "所有者役の uid が 1000 でない: $owner_uid" >&2; exit 1; }
              test "$other_uid" = 1001 \
                || { echo "別 UID 役の uid が 1001 でない: $other_uid" >&2; exit 1; }
              test "$owner_uid" != "$other_uid" \
                || { echo "2つの主体が同じ uid（$owner_uid）＝この検査は何も見ていない" >&2; exit 1; }

              # まず所有者（デーモン役・uid 1000 = node）からは繋がることを見る。
              # ここが繋がっていなければ、下の「別 UID から繋がらない」が
              # 「ソケットが誰からも繋がらない壊れ方」なのか「別 UID からだけ
              # 繋がらない」なのか見分けが付かない。
              su -s /bin/sh node -c \
                "curl -fsS --unix-socket /run/alteroid/runner.sock http://runner/livez" \
                >/dev/null \
                || { echo "所有者(uid 1000)からも繋がらない（前提が壊れている）" >&2; exit 1; }

              # 別 UID（worker・uid 1001 = マネージャー子プロセスの主体）からは
              # そもそも繋がらないこと。
              su -s /bin/sh worker -c \
                "curl -fsS --unix-socket /run/alteroid/runner.sock http://runner/livez" \
                >/dev/null \
                && { echo "別 UID(uid 1001)から繋がってしまった" >&2; exit 1; }
              exit 0
            '

      # **`db` サービス専用の像も、素の `postgres:17-alpine` から `ALTEROID_DATABASE_URL`
      # 1本だけで起動できることを実物で見る。** ここが無いと、`docker/db.Dockerfile` /
      # `docker/alteroid-db`（URL パース）の誤りに、実際に `docker compose up` する
      # まで気づけない——上の `alteroid:ci` の像とは別の Dockerfile なので、上の
      # ステップはこちらを一切検証していない。
      - uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/db.Dockerfile
          load: true
          tags: alteroid-db:ci
          cache-from: type=gha,scope=db
          cache-to: ${{ env.DRIFT != 'true' && 'type=gha,scope=db' || '' }}
          no-cache: ${{ env.DRIFT == 'true' }}

      # パスワードに `:` / `@` / パーセントエンコードが混じっても正しく割れること
      # まで見る（素朴なシェルのパラメータ展開だと誤って割ってしまう値である）。
      - name: db は ALTEROID_DATABASE_URL 1本（記号入りパスワード込み）から起動できるか
        run: |
          docker run -d --name alteroid-db-ci \
            -e ALTEROID_DATABASE_URL='postgres://alteroid:p%40ss%3Aword@db:5432/alteroid' \
            alteroid-db:ci
          trap 'docker logs alteroid-db-ci; docker rm -f alteroid-db-ci >/dev/null 2>&1' EXIT

          # **`pg_isready` だけでは初期化完了を判定できない（実測で踏んだ）。** postgres
          # 公式イメージは初回起動時、initdb 直後に「セットアップ専用の一時サーバー」
          # （Unix ソケットで待受けるが `POSTGRES_DB` 相当のデータベース作成前）を
          # 一時的に起こす。`pg_isready` はこの一時サーバーに対しても「accepting
          # connections」を返すため、そのタイミングで `psql -d alteroid` を打つと
          # `FATAL: database "alteroid" does not exist` になる（本番サーバーへの
          # 切り替えより前）。手元では初期化が速く終わってたまたま踏まなかったが、
          # CI では実際にこのレースを踏んだ（run 34826494756）。
          # ⟹ 「接続を受け付けるか」ではなく「実際に目的の db へ繋がるか」自体を
          # リトライの条件にする。
          for _ in $(seq 1 30); do
            docker exec -e PGPASSWORD='p@ss:word' alteroid-db-ci \
              psql -U alteroid -d alteroid -c 'select 1;' >/dev/null 2>&1 && break
            sleep 1
          done

          # パースしたユーザー名・db 名・（デコードした）パスワードで実際に繋がること。
          docker exec -e PGPASSWORD='p@ss:word' alteroid-db-ci \
            psql -U alteroid -d alteroid -c 'select 1;' \
            || { echo "パースしたユーザー名/パスワードで繋がらない" >&2; exit 1; }

  # **PR の base が古く、かつ merge base 以降に main へ入った変更が、この PR と
  # 同じファイルを触っているときだけ赤くする（#838）。** 判定ロジックは
  # `scripts/check-base-overlap-core.mjs` が正本（compare API の向きの実測・
  # 4値の verdict・300件打ち切りの扱いはあちらの doc）。ここは呼び出しだけ。
  base-overlap:
    # **この `if:` は `ci` / `image` と意図的に逆（`==` の側）で書く。** `ci.yml`
    # 自身の `ci` ジョブの直上に「`github.event.pull_request.draft == false` を
    # 単独では書かない」という長い doc が在り、「先例に揃えて書き換えるな」と
    # 明示されている——**が、それは `ci` と `image` がどちらも push・pull_request・
    # workflow_dispatch（`image` はさらに schedule）を1つのジョブで兼ねている
    # ことが理由であって、`==` そのものが常に間違っているわけではない。** 実際
    # `ci` の doc も「どちらが正しいかは、そのジョブが*どのイベントを兼ねているか*
    # で決まる」と書いており、**このジョブはその基準に従った結果として違う形に
    # なっている**（先例を知らずに違えたのではない）。
    #
    # **このジョブは pull_request 専用である。** PR が無ければ「base」も「PR が
    # 触るファイル」も存在せず、測る対象そのものが無い。push（main）・schedule・
    # workflow_dispatch では `github.event.pull_request` が存在せず
    # `null == false` は偽になるので、`==` の形でも安全に skip される
    # （`!=` にする理由——push を検査ゼロのまま緑にしてしまう罠——がそもそも
    # 発生しない。実行して意味のある経路が pull_request の1つしか無いため）。
    #
    # ⚠️ **`push` では `skipped` になるが、それが安全なのはこのジョブが required
    # contexts に入っていないからである。** `skipped` は required の判定では
    # 満たしたものとして扱われる。**もし将来このジョブを required に入れるなら、
    # この `if:` は同時に見直さなければならない**（`push` を無条件に「満たした」
    # ことにしてしまうと、main への直 push がこの検査を一度も受けずに緑になる）。
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: pnpm check:base-overlap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # `github.sha`（pull_request イベントでは merge commit の sha）ではなく、
          # PR ブランチの先端そのものを渡す。名前は `check-base-overlap.mjs` が
          # 決めたもの（あちらの doc の「入力」表を見よ）。
          BASE_OVERLAP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_OVERLAP_PR_NUMBER: ${{ github.event.pull_request.number }}

  # **`base-overlap` を required contexts には入れていない。**
  #
  # ⚠️ **`contexts` の中身をここに数え上げない —— 増えるたびに腐る。** ここには
  # 「`ci` / `image`（2026-09-12実測）」と書いてあったが、実測 2026-09-17 で
  # `["ci","image","no-attribution-trailers","pr-title-type"]` の4本だった。
  # **持ち主は `.github/required-status-checks.json` と
  # `pnpm check:required-status-checks`（protection と突き合わせる）である。**
  # 取り直すには `gh api repos/takecchi/alteroid/branches/main/protection --jq '.required_status_checks.contexts'` を打つ。
  #
  # 1. **この歯は GitHub API とファイルパスの積集合というヒューリスティックに
  #    依存する。** 誤検知（無関係な同名変更・偶然のパス一致）が required だと、
  #    repo 全体のマージがそれだけで止まる。
  # 2. **この歯は判定時点の値で測る。** 判定後に main が進めば、その判定は古く
  #    なる。⟹ required にすると「門が閉じている」と読める緑を配ってしまい、
  #    `check-base-overlap-core.mjs` の `IDENTITY_STATEMENT`
  #    （気付くための歯であって、不可能にするための歯ではない）と構造的に
  #    矛盾する。
  #
  # **`.github/required-status-checks.json` はここでは触っていない。** あれは
  # protection の**宣言**であり、`pnpm check:required-status-checks` が実際の
  # protection と突き合わせるためのもの（`check-required-status-checks-core.mjs`
  # の doc）。protection 側を変えていない以上、あそこへ `base-overlap` を足すと
  # 「宣言に在るのに protection に無い」という drift をこちらで新しく作ることに
  # なる。
  #
  # **将来 required にしたくなったときの手順**: (a) リポジトリの branch
  # protection の required status checks に `base-overlap` を追加する →
  # (b) `.github/required-status-checks.json` の `contexts` にも `base-overlap`
  # を足し `observedAt` を更新する → (c) 上の `if:` を見直す（`skipped` が
  # required を満たしてしまう問題を、`push` を required から外すか他の形で
  # 塞いだ上で入れる）。この3つは順番も含めて揃える必要がある——`(a)` だけ先に
  # やると `check-required-status-checks` が drift として赤くなり、`(b)` だけ
  # 先にやっても protection は変わらないので何も強制されない。

  # **required contexts が出るジョブを載せている workflow が、GitHub 上で
  # `active` かを見る（Issue #1290）。** 2026-09-22、
  # `.github/workflows/pr-title.yml` が GitHub 上で `disabled_manually` に
  # された。この workflow は required contexts の1本（`pr-title-type`。いまは
  # 廃止済み）を出していたが、無効化されると**その門の check-run は二度と
  # 生成されない**——required は「赤い」のではなく「一覧に永久に現れない」
  # 状態になり、宣言（`.github/required-status-checks.json`）も `ci.yml` 側の
  # ジョブ定義も1文字も変わらないまま、open な PR 5本が理由も見せずに
  # `BLOCKED` になって静かに詰まった。判定ロジックは
  # `scripts/check-required-gate-workflows-core.mjs` が正本。ここは呼び出し
  # だけ。
  #
  # ⛔ **required contexts には入れない。** required にすると、この検査自身が
  # 落ちたとき（`gh api` の一時的な失敗など）に**すべての PR のマージが
  # 止まる**——それはまさにこの Issue が塞ごうとしている症状（required な門が
  # 理由も見せずに PR を詰まらせる）を、この検査自身が起こす形になる。
  # ブランチ保護は1バイトも変えない（この検査は読むだけであり、変える判断は
  # 別の担当）。
  #
  # ⛔ **`ci` ジョブの中の step にもしない。** `ci` は required なので、そこへ
  # step として足すと、この検査が読む `gh api repos/…/actions/workflows` が
  # 一時的に失敗しただけで required な `ci` 全体が赤くなる。**独立したジョブに
  # すれば、この検査の失敗は required ジョブへ伝播しない。** `base-overlap` と
  # 同じ形。
  #
  # **`if:` は `image` と同じ形にしてある。** この検査が答える問い
  # （「required な門を出す workflow は GitHub 上で `active` か」）は**どの
  # イベントで走ったかに依存しない事実**である——PR でも main への push でも
  # 定時実行でも、同じ問いに同じ答えが返る。draft の pull_request だけ
  # 節約するのは `ci` / `image` と同じ理由（重い処理ではないので節約の実益は
  # 薄いが、`base-overlap` 同様に「PR が無いなら測る意味が薄い」を意図的に
  # 分けてはいない——`push` / `schedule` / `workflow_dispatch` はそのまま
  # 全部走らせたいので、`ci` の doc が警告する罠1（`draft == false` 単独では
  # 書かない）にそのまま倣う）。
  #
  # ⭐ **なぜ push / schedule でも走らせるのか。** `main` への push や定時の回で
  # このジョブが落ちれば、`.github/workflows/main-ci-alarm.yml`（`workflow_run`
  # で `workflows: [CI, …]` の `conclusion == 'failure'` を見て Issue を立てる
  # 既存の警報）がそのまま拾う——この workflow の `name:`（`CI`、本ファイル
  # 冒頭）のジョブが1本でも failure になれば run 全体が failure になるためで
  # ある。**新しい通知の仕組みを1つも増やさずに、「無効化されても誰も
  # 気づかない」を閉じる。** PR の回では PR 画面に赤い
  # `required-gate-workflows` として出るので、**詰まっている PR の側が原因を
  # 名乗る。** この2つが #1290 の答えである。
  #
  # ⚠️ **残る穴: `ci.yml` 自身が GitHub 上で無効化されたら、このジョブも
  # 走らない。** この検査は「required な門が出ているか」を見る歯であって、
  # 自分自身を含む `ci.yml` が丸ごと止められた場合までは見ていない。
  # 「塞いだ」と言い過ぎないこと——その穴は残る。
  #
  # ⭐ **この穴は、2026-09-23 に「開けたままにする」と決めた**（#1320。
  # クローンの判断であって、人間のオーナーの回答ではない）。見張りの
  # workflow を `ci.yml` の外へ1本足せば塞げるように見えるが、**今度はその見張りが
  # 止められたときに気づけない——自己参照は1段ずらせるだけで消えない。**
  # 「走らなくなったこと」を走る仕組みで検出しようとすると無限後退する。
  # `main-ci-alarm.yml` への相乗りもできない（`workflow_run` で `CI` の**完了**に
  # 反応する形なので、`CI` が走らなくなった状態はそもそも発火しない）。⟹ **後退を
  # 断てるのは機構の外から見る目だけで、それはクローンである。** #1207 が「`main` の
  # 赤で止める門」を実測を根拠に作らないと決めたのと同じ形の判断である。
  # ⚠️ **「穴が無い」ことにはしない——開いたまま、意図的に開けてある。**
  #
  # **この歯が見ているのは「宣言」であって protection ではない。** ここが
  # 見るのは `.github/required-status-checks.json` の宣言だけである。宣言
  # そのものがブランチ保護（required contexts）と一致しているかは
  # `pnpm check:required-status-checks` の仕事——**あちらはブランチ保護の
  # 読み出しに administration 相当の権限が要り、GitHub Actions の
  # `permissions:` には指定できるスコープが無いので CI に配線できない**
  # （`STEPS` にも入れていない。理由は `check-required-status-checks-core.mjs`
  # の doc）。**こちらが読むのは `gh api repos/…/actions/workflows` で、要る
  # 権限は `actions: read` だけ——CI に配線できる。だから分けている。** 2本
  # 合わさって初めて「required の門は宣言どおり存在し、かつ生きている」まで
  # 言える。
  required-gate-workflows:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      # **`GITHUB_REPOSITORY` は渡さない。** `check-required-gate-workflows.mjs`
      # が読む API パスは `takecchi/alteroid` を直書きしてある
      # （`check-required-status-checks.mjs` の `PROTECTION_PATH` と同じ流儀）。
      # ここで見たいのは「**upstream の** required な門が生きているか」であって、
      # fork 側の workflow 一覧ではない。⟹ 渡しても使われない変数を置くと、次に
      # 読む人が「repo ごとに切り替わる」と誤読する。
      - run: pnpm check:required-gate-workflows
        env:
          GH_TOKEN: ${{ github.token }}
