name: CI

on:
  push:
    branches: [main]
  pull_request:
    # **`ready_for_review` を明示で足す。** GitHub の既定は
    # `[opened, synchronize, reopened]` で、**`ready_for_review` を含まない。**
    # 下の `ci` / `image` の `if:` は draft の間だけ節約する形にしてあるが、
    # 節約が効くのは「draft → ready の遷移そのものが1回の `pull_request` イベントに
    # なる」ときだけである。既定のままだと、その遷移はどの `types` にも当たらず
    # イベントが起きない ⟹ **draft のときに skip した required チェックの結果が
    # そのまま「まだ走っていない」状態で固定され、ready にしても本物の run が
    # 1本も起きないまま古い（存在しない）結果を待ち続ける。** ここを足し忘れると、
    # 節約の仕組みそのものが「draft のまま一生 skip される」事故に化ける。
    #
    # **この並び自体は、同じオーナーの別 repo（非公開）に在る先例と同じ課題への
    # 答えである**（観測 2026-09-11、read-only で確認しただけで、あちらは1バイトも
    # 変えていない）。⚠️ ここで引くのは**一般化された設計の判断だけ**にとどめる
    # （repo 名・ファイル名・ジョブ名・設定の有無といった中身は、非公開 repo の
    # ものなので書かない）。**書式は真似しない** — この repo は
    # `pnpm format:check`（prettier）が YAML にも掛かるので、角括弧の内側の空白の
    # 有無を含めて prettier が決める形に従う。**`if:` の書き方も意図的に違えて
    # ある**（理由は下の `ci` の `if:` の doc）。
    types: [opened, synchronize, reopened, ready_for_review]
  # **上流ドリフトを見に行く回。ここだけキャッシュを使わずに焼く**（下の `image` の
  # `no-cache`）。**定時にしてあるのは、PR の門を人質に取らないためである** — `ci` と
  # `image` は required なので（**正本は `.github/required-status-checks.json`。
  # ここに値を書き写さない** —— 写しが2つあると、片方だけ直した回の食い違いが
  # どこからも見えなくなる）、PR ごとに焼き直す形に
  # すると、**上流の apt が落ちている間は1本もマージできなくなる。**
  # 鳴らしたいのは警報であって、門ではない。
  #
  # **時刻は release/prod への反映より前にしてある。** あちらは `cron: '17 19 * * *'`
  # で、実測の発火は 21:19〜22:04Z（観測 2026-09-05〜09、`event=schedule` の5回）。
  # ここを 15:41Z にしておけば、`AGENTS.md` が記録している最大の遅れ（2時間37分）を
  # 足しても 18:18Z ごろには始まるので、**今夜のデプロイの前に鳴る。**
  # 分をずらしてあるのは release-prod.yml と同じ理由である（逐語は
  # `grep -Fn -- '時刻ぴったりを避けている' .github/workflows/release-prod.yml`）。
  schedule:
    - cron: '41 15 * * *'
  # 次の定時まで待てない場合の口（`release-prod.yml` の `workflow_dispatch` と同じ形）。
  workflow_dispatch:

# **同じ PR に続けて push したとき、古い実行を残さない。** 後から押した commit の
# 結果しか見ないのに、前の実行は最後まで runner を占有する。並行して PR を抱えている
# ときはその占有がそのまま他の PR の待ち時間になる。
#
# **キーは「何の実行か」で分ける。**
#
# - `github.head_ref` は pull_request のときだけ値が入る（PR の元ブランチ名）。
#   つまり**同じ PR の実行だけが同じ群に入り、新しい方が古い方を消す**
# - push（main）と、定時実行・手動起動では `head_ref` が空なので `github.run_id` に
#   落ちる。これは実行ごとに必ず違うので、**main の実行はどれも群を共有せず、
#   キャンセルされない**。main の各 commit は release/prod へ写る候補そのもので、
#   「この commit で緑だった」の記録が後続の push で消えると、どの commit まで
#   確かめたかが言えなくなる
#
# **`github.ref` で書かないこと。** pull_request の `github.ref` は `refs/pull/<n>/merge`
# で PR ごとに違うので PR 側は同じように効くが、push 側まで1つの群（`refs/heads/main`）に
# まとまる。`cancel-in-progress: true` と併せると**上の main の性質が消える**。
#
# 走行中を切るのは PR の CI だけである。release/prod（`cancel-in-progress: false`）と
# 逆にしてあるのは、あちらが途中で切れると push の途中で終わるからで、こちらは
# 読み取りと検査しかしないので途中で切れても外に影響が残らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# **上流ドリフトを見に行く回か。** `image` の `no-cache` と `cache-to` をこれで切り替える。
# 判定を1か所に置いてあるのは、2か所に書くと片方だけ直されて食い違うからである。
#
# ⚠️ `<条件> && '' || <値>` の形で書かないこと。**空文字は GitHub 式で falsy なので
# 必ず右へ落ちる。** 下の `cache-to` は「真のときに非空を返す」向きで書いてある。
env:
  DRIFT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

# **無条件（`if:` も `needs:` も持たない）で走る安いジョブは置いていない。**
# 同じオーナーの別 repo（非公開）の先例から引いた**判断の基準**はこれである
# ——「**その門は、PR に紐付かない経路（依存のインストールを経ない clone・
# PR を経由しない直 push）を見ているか。見ているなら条件で狭めてはならない**」。
# ⚠️ **「draft の間 required が skipped になるのを避けるため」ではない**
# （そこを取り違えると、当たらない所へ形だけ運ぶことになる）。狭めた瞬間に
# その経路ごと見えなくなる、というのが基準の中身である。
#
# **alteroid にこの基準を当てると、無条件ジョブは要らない。** `ci` は
# push（main）と workflow_dispatch で、`image` はさらに schedule でも走り
# 続ける——上の `ci` / `image` の `if:` は `pull_request` の枝だけを draft の
# 間だけ狭めており、他のイベントの経路は1ミリも変えていない。⟹ 「PR に
# 紐付かない経路（直 push・手動起動・定時）を見る」役目は、**既存の2ジョブが
# そのまま持っているので、別に無条件ジョブを立てる理由が無い。**
jobs:
  ci:
    # **定時の回は回さない。** あの回が訊いているのは「上流が動いて器が焼けなく
    # なっていないか」だけである。ここまで毎晩回すと、別の主張（依存の更新で単体
    # テストが落ちないか）を黙って足すことになる。手動起動では回す。
    #
    # **draft の pull_request では回さない（重い CI を人質に取らない）。** ただし
    # 条件は「`github.event_name != 'schedule'` の後ろへ draft の判定を足す」形に
    # してあり、**`github.event.pull_request.draft == false` だけを単独では書かない。**
    #
    # 理由 —— `push`（main）・`schedule`・`workflow_dispatch` のどのイベントでも
    # `github.event.pull_request` はそもそも**存在しない**（コンテキストに無い
    # キーは GitHub 式では `null` になる）。GitHub Actions の式は `null == false` を
    # **false** と評価する（`true` ではない）ので、`draft == false` だけを条件に
    # すると、push でも schedule でも `false` になって**この歯が main の CI ごと
    # 消える** —— required チェック（`ci`）が絶対に走らない形で赤くも表示されず、
    # ブランチ保護がただ黙って通ってしまう。**これがいちばん危ない罠である**（push を
    # 何も検査しないまま「緑」にする）。だから先に `github.event_name` で
    # `pull_request` かどうかを分け、**pull_request 以外はこの判定を素通りさせる**
    # （`!= 'pull_request'` の左辺が真になり、右辺の `draft` を評価するまでもなく
    # `||` で true に落ちる）。draft を見るのは「いま本当に pull_request イベントで
    # あるとき」だけである。
    #
    # **⚠️ 同じオーナーの別 repo（非公開）に、この判定を `==` の側で書いた先例が
    # 在る。ここを「先例に揃えよう」と書き換えないこと。** `github.event_name ==
    # 'pull_request' && draft == false` の形が正しくなるのは、**PR 専用ジョブと
    # push 専用ジョブが最初から分かれている**場合である。**この repo の `ci` は
    # push（main）・pull_request・workflow_dispatch の3イベントを1つのジョブで
    # 兼ねている**ので、`==` に書き換えると `push` と `workflow_dispatch` まで
    # 丸ごと skip される——これはまさに直上で説明した罠そのものである（今度は
    # `pull_request` 以外の全イベントが対象になる、より広い形で）。🔑 **どちらが
    # 正しいかは、そのジョブが*どのイベントを兼ねているか*で決まる。** `!=` で
    # 「pull_request 以外は素通りさせる」形を維持しているのは、先例を知らなかった
    # からではなく、**知ったうえで意図的に違えている。**
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Node と pnpm の版は mise.toml が持つ（ローカルと同じものを使う）
      - uses: jdx/mise-action@v4
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # **`apps/web` の生成物に Node 専用の痕跡が無いことを見る（結果側の歯）。**
      # `@alteroid/core`（サーバ専用のドメイン層まで丸ごと再エクスポートするバレル）
      # から**値**を import すると、そのコードごとブラウザバンドルへ入る事故が実際に
      # 起きた（#294 / #306。`commitments` ルートのチャンクが 1.2MB に膨らみ、
      # `node:module` の `createRequire` 呼び出しがブラウザでのモジュール評価
      # 時点で例外を投げて、本番で一度も開けなくなった）。
      #
      # `eslint.config.js` の `@typescript-eslint/no-restricted-imports` が
      # 同じ事故の**入口**（`@alteroid/core` からの値 import）を塞ぐが、経路を
      # 固定した歯なので、別の依存から同じ形の混入が起きたら鳴らない。この検査は
      # 経路を問わず**生成物そのもの**を見るので、原因が何であっても捕まえる。
      # 検査語の選び方・言えないことは `scripts/check-web-bundle-node-traces.mjs` の
      # doc を見よ。
      - run: pnpm check:web-bundle-node-traces

      # **`apps/web` の生成物のバイト数が閾値を超えていないことを見る（大きさ側の歯）。**
      # 上の歯（node-traces）と `eslint.config.js` の import 制限は、どちらも
      # 「事故の原因（サーバ専用コードの混入）」を見る歯である。別の原因で
      # チャンクが膨らんだら、どちらも鳴らない。この検査は原因を問わず
      # **大きさそのもの**を見る3本目の歯であり、`/commitments` のチャンクが
      # 1,198,608 B に膨れて本番で開けなくなった事故そのもの
      # （https://github.com/takecchi/alteroid/issues/335）が再発すれば必ず捕まえる。
      # 閾値の根拠・言えないことは `scripts/check-web-bundle-size.mjs` の doc を見よ。
      - run: pnpm check:web-bundle-size

      # **`apps/web` の生成物の CSS に、コメントの誤拾いで生まれた不正な宣言が
      # 入っていないことを見る（もう1つの結果側の歯）。**
      #
      # Tailwind のスキャナはソースコードの「コメントの中」に書かれたクラス名も
      # 拾う。省略記号などのプレースホルダを混ぜたコメント（`pr-[calc(...+
      # var(--safe-right))]` など）を書くと、コンパイル後の CSS に
      # `padding-right:calc(...+var(--safe-right))` という不正な宣言がそのまま
      # 出る事故が実際に起きた（#317）。不正な宣言はブラウザが黙って捨てるので、
      # 画面には何も起きない。検査語の選び方・言えないことは
      # `scripts/check-web-css-comment-classnames-core.mjs` の doc を見よ。
      #
      # **この検査は #317 で入ったが、`check:web-css-comment-classnames` は
      # package.json にしかなく、`scripts/verify.mjs`（実体は `verify-core.mjs`
      # の STEPS）にも ci.yml にも呼ばれていなかった。在るのに効いていない道具は、
      # 静かに失敗する（`AGENTS.md`「静かに失敗する道具」— #646 の
      # `check:sdk-quotes` と同じ形の穴だった）。**
      - run: pnpm check:web-css-comment-classnames

      # **コードと OpenAPI spec がずれたまま気づかない状態を作らない。**
      # spec は経路の zod スキーマから機械生成され、`pnpm build` が毎回書き直す。
      # つまりここに差分が出るのは「コードを変えたのに commit した spec が古い」
      # ときだけである。手書きの spec を別に置いて二重管理にしないための検査であり、
      # 人間に「先に生成コマンドを流す」手順を足さないための場所でもある（Issue #20）。
      #
      # **この検査が言えること / 言えないこと。** 守りたいのは
      # `docs/PRD.md`「要件: インターフェース（CLI・HTTP API・Web UI）」— **画面の都合で
      # API に経路を足さない**（足した瞬間に「CLI ではできないこと」が生まれる）。
      # ここが見ているのは、その要件のうち**機械で見える一部だけ**である。
      #
      # - **言えること**: commit 済みの `openapi.json` が、いまのコードから生成される
      #   ものと一致している（spec が古くない）。経路やスキーマを変えたのに spec を
      #   commit し忘れた、が通らない
      # - **言えないこと**: 足された経路が**画面のためのものかどうか**。ここは
      #   「spec が最新か」しか見ないので、`apps/web` の都合で経路を1本足して
      #   `pnpm build` して spec も一緒に commit すれば、**この検査は緑のまま通る**
      #
      # **だから入口の等価性を「CI が守っている」と読まないこと。** 守っているのは
      # 二重管理の防止であって、等価性ではない。等価性（CLI でできないことを作らない）
      # を守っているのは、いまのところ**レビューだけ**である
      # （`docs/PRD.md`「要件: インターフェース」、`AGENTS.md`「実装の前提」）。
      #
      # **参照先を上位文書にしてあるのは意図である。** ここは以前 roadmap の受け入れ基準を
      # 指していたが、roadmap は動く文書で、実際にその基準は 2026-08-21 の削除で消えた。
      # **要件は PRD と north_star に在る。新しく書く参照は上位を指す。**
      #
      # 計器の側に「この数字が言えないこと」を貼ってあるのは、#129 / #131 と同じ形で
      # ある。**言えないことを書いていない計器は、読む側が言えると思い込む。**
      - name: OpenAPI spec がコードと一致しているか
        run: |
          git diff --exit-code -- apps/daemon/openapi.json || {
            echo "::error::apps/daemon/openapi.json が古い。pnpm build して差分をコミットすること" >&2
            exit 1
          }

      # **同梱 SDK から逐語で引いたコメントが、いまの版でも逐語であることを当てる。**
      # 引き写した先はこの repo のソースなので、SDK の版を上げても差分には出ない —— #639
      # （0.3.259 → 0.3.261）は lock と catalog の2ファイルだけで、それでも
      # `agent-events.ts` の逐語は同じ更新で嘘になった（#646）。**引用は外の版に依存して
      # おり、依存はコンパイラにもレビューにも見えない。**
      #
      # **この検査は #646 で入ったが、どの門からも呼ばれていなかった**（`package.json` に
      # script は在り、`scripts/verify-core.mjs` の STEPS にも ci.yml にも無かった）。
      # 在るのに効いていない道具は、静かに失敗する（`AGENTS.md`「静かに失敗する道具」）。
      - run: pnpm check:sdk-quotes
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # イメージもここで焼く。**マネージャーの道具は版を固定していない**（人間の手元より
  # 古い `gh` を配らないため）ので、上流が変わって壊れたことに気づく場所が要る。
  # ここが無いと、気づくのがデプロイ時になる。
  #
  # 焼くのは runtime ステージ = 実際に走る器そのものである。amd64 だけ焼く
  # （Railway と同じ。アーキテクチャ差は apt の `dpkg --print-architecture` 任せに
  # してあるので、arm64 固有の分岐はもう無い）。
  image:
    # **draft の pull_request では焼かない。** `ci` の直上に書いた理由（`push` /
    # `schedule` / `workflow_dispatch` では `github.event.pull_request` が存在せず
    # `null == false` は偽になるので、`draft == false` 単独では書けない）が
    # そのまま当てはまる。**ただし schedule はここでは除外しない** — 上の `env.DRIFT`
    # /「上流ドリフトを見に行く回」がこのジョブに要求している役目（`ci` とは違い、
    # `image` は定時でも走り続けて上流の apt/イメージの崩れを見張る）は変えない。
    # ⟹ `ci` の条件から `github.event_name != 'schedule'` の項だけを抜いた形にする。
    #
    # **`!=` を使う理由（先例と意図的に違えている理由）は `ci` の if: の
    # doc に書いた——ここでも同じ理由がそのまま当てはまる。** `image` は
    # push・pull_request・schedule・workflow_dispatch の4イベントを1つの
    # ジョブで兼ねているので、`==` の形にすると `pull_request` 以外の全
    # イベント（push を含む）が skip される。ここも「先例に揃えよう」で
    # 書き換えないこと。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: alteroid:ci
          # クローンの自己認識に載るリビジョン。**ビルド文脈に `.git` は入れない**
          # ので、渡さないと「リビジョン不明」の器が焼ける。不明でも壊れないが、
          # 自分が走っているコミットを言えるかどうかは調べ物の精度に直結する。
          build-args: |
            ALTEROID_BUILD_REV=${{ github.sha }}
          cache-from: type=gha
          # **定時の回はキャッシュを書き戻さない。** 書き戻すと翌日の PR の `image` が
          # その層で焼かれることになり、上流が動いた日に**無関係な PR が赤くなる**
          # ＝ 上の `schedule` で避けたはずの「門を人質に取る」がそのまま戻ってくる。
          cache-to: ${{ env.DRIFT != 'true' && 'type=gha' || '' }}
          # **このジョブが自分で名乗っている役割は、ここが無いと果たされない**（逐語は
          # `grep -Fn -- '上流が変わって壊れたことに気づく場所が要る' .github/workflows/ci.yml`）。
          # 実測（観測 2026-09-10T06:57Z、`main` の run 34447496931 の `image` ジョブの
          # ログ）: `apt-get install … git ripgrep jq gh tini` の層は `#22 CACHED` で、
          # **一度も走っていなかった。** ベースの digest と Dockerfile の本文が変わらない
          # 限り再実行されないので、`gh` の apt リポジトリ側だけが動いても気づけない。
          #
          # **この回が言えること / 言えないこと。**
          #
          # - **言えること**: いまの上流で、この Dockerfile が素から焼けるか。焼けた
          #   イメージが下の実挙動の歯を通るか
          # - ⚠️ **言えないこと(1): 今夜 Railway が何を焼くか。** Railway は
          #   `railway/daemon.json` / `railway/runner.json` の `builder: DOCKERFILE` で
          #   **自分でもう一度焼く**ので、層のキャッシュもこちらとは別物である。実測
          #   （観測 2026-09-10T08:24Z、走っている runner の中から）: 本番の器の
          #   `/usr/bin/gh` は `2.98.0`（ファイルの日付 2026-08-20）で、同じ時刻に
          #   `https://cli.github.com/packages/dists/stable/main/binary-amd64/Packages`
          #   が配っていたのは `2.100.0` だった。⟹ `Dockerfile` の
          #   `grep -Fn -- 'その時点の版が入るようにしてある' Dockerfile` は、**層の
          #   キャッシュが在るあいだ成り立たない**
          # - ⚠️ **言えないこと(2): これは警報であって門ではない。** ここが赤くても夜の
          #   反映は止まらない（逐語は
          #   `grep -Fn -- 'SHA が違えば push する。それだけである。' .github/scripts/reflect-release-prod.sh`）
          no-cache: ${{ env.DRIFT == 'true' }}

      # **マネージャーが実際に走る主体（uid 1001）で見る。** root で揃っていても、
      # 降りた先で欠けていれば「コンテナだからできない」が生まれる（north_star 禁止1）。
      - name: マネージャーの道具が揃っているか
        run: |
          docker run --rm -u 1001 alteroid:ci sh -eu -c '
            for t in git gh jq rg curl node pnpm alteroid; do
              command -v "$t" >/dev/null || { echo "道具が無い: $t" >&2; exit 1; }
            done
            gh --version
            git --version

            # git が資格情報を gh から借りる配線。鍵は焼かないが、経路は焼く。
            helper=$(git config --get-urlmatch credential.helper https://github.com/x/y)
            test "$helper" = "!gh auth git-credential" \
              || { echo "credential helper が違う: $helper" >&2; exit 1; }

            # 鍵が無くても公開リポジトリの clone は通る（無い状態が壊れていないこと）。
            cd /tmp && git clone --depth 1 -q https://github.com/cli/cli.git probe
          '

      # **「渡したつもり」で終わらせない。** 上のビルドで `ALTEROID_BUILD_REV=
      # github.sha` を渡したが、それが実際に焼き込まれ、`resolveBuildRevision()`
      # が `commit === github.sha` かつ `source === 'build'` を返すことまで見る。
      # 渡した build-arg が握りつぶされていても、ここが無ければ気づけない。
      - name: 焼いたイメージが github.sha を実際に名乗るか
        run: |
          docker run --rm -u 1001 -e GITHUB_SHA="${{ github.sha }}" alteroid:ci node -e '
            import("/app/packages/core/dist/index.js").then(({ resolveBuildRevision }) => {
              const rev = resolveBuildRevision();
              const expected = process.env.GITHUB_SHA;
              if (rev.commit !== expected || rev.source !== "build") {
                console.error(
                  "焼き込みが github.sha を名乗っていない: " + JSON.stringify(rev) +
                    "（期待: commit=" + expected + ", source=build）",
                );
                process.exit(1);
              }
              console.log("ok: " + JSON.stringify(rev));
            }).catch((error) => { console.error(error); process.exit(1); });
          '

      # **鍵が凍らないこと。** env で配ると、鍵は runner の起動時に固定され、走行中の
      # マネージャーには永久に届かない（「鍵を直す」と「走行中の仕事を失う」が同じ
      # 操作になる）。`gh` が毎回ファイルを読むこと自体をここで見る。手元で壊れたことに
      # 気づける場所が他に無い。
      - name: 鍵が走行中に差し替えられるか（gh がファイルを読み直す）
        run: |
          docker run --rm -u 1001 alteroid:ci sh -eu -c '
            f=/tmp/gh-token
            export ALTEROID_GH_TOKEN_FILE="$f"

            # シムが実体より先に見つかること（PATH の順序が崩れていないこと）
            test "$(command -v gh)" = /usr/local/bin/gh \
              || { echo "gh のシムが効いていない: $(command -v gh)" >&2; exit 1; }

            printf %s "token-one" > "$f"
            gh auth token 2>/dev/null | grep -qx "token-one" \
              || { echo "1回目の鍵を読めていない" >&2; exit 1; }

            # **同じプロセス環境のまま**中身だけ差し替える（走行中の差し替えを模す）
            printf %s "token-two" > "$f"
            gh auth token 2>/dev/null | grep -qx "token-two" \
              || { echo "差し替えた鍵が届いていない（凍っている）" >&2; exit 1; }

            # 空の鍵は「置かれていない」と同じ扱い（空を export すると壊れ方が悪化する）
            : > "$f"
            gh auth token >/dev/null 2>&1 \
              && { echo "空の鍵が鍵として通っている" >&2; exit 1; }
            exit 0
          '

      # **人間が置く値は app と runner で同じ。** その楽さと引き換えに守りが落ちて
      # いないことを、器そのもので見る（docs/architecture.md「制御面の保護」3枚目）。
      # ここが落ちたら、直すのは運用手順ではなく `docker/alteroid-runner` である。
      - name: 走っている runner に素の合鍵が残らないか
        run: |
          docker run --rm -u 0 -e ALTEROID_RUNNER_TOKEN=raw-secret -e ALTEROID_RUNNER_PORT=4518 \
            alteroid:ci sh -eu -c '
              alteroid-runner &
              sleep 3

              # 見るのは**走っているプロセスの環境**。ここに素の値が残ると、UID の分離が
              # 崩れた場面で子プロセスが /proc から読める。
              tr "\0" "\n" < /proc/$!/environ | grep -q "^ALTEROID_RUNNER_TOKEN=" \
                && { echo "素の合鍵が残っている" >&2; exit 1; }
              tr "\0" "\n" < /proc/$!/environ | grep -q "^ALTEROID_RUNNER_TOKEN_SHA256=" \
                || { echo "sha256 へ畳めていない" >&2; exit 1; }

              # 畳んでも本人確認は成立する（鍵が無ければ 401、同じ値なら通る）
              test "$(curl -s -o /dev/null -w %{http_code} http://127.0.0.1:4518/managers)" = 401 \
                || { echo "鍵なしで制御面が通った" >&2; exit 1; }
              test "$(curl -s -o /dev/null -w %{http_code} -H "authorization: Bearer raw-secret" \
                http://127.0.0.1:4518/managers)" = 200 \
                || { echo "デーモンと同じ値で通らない" >&2; exit 1; }
            '

      # 入口の認証（ログイン）の鍵も、人間は共有の1か所に置く。**走っている runner が
      # それを持っていないこと**を器そのもので見る（合鍵とまったく同じ理由 — 読めた
      # 瞬間、マネージャーが自分でアクセストークンを発行して記憶へ届く）。
      #
      # 同時に、**下＝外の世界へ手を伸ばす鍵は落ちていないこと**も見る。ここを一緒に
      # 見ないと、「危なそうな名前を全部消す」方向へ倒れて `gh pr create` が層を
      # 下りた瞬間にできなくなる（デグレード。north_star 禁止1）。
      - name: 走っている runner にログインの鍵が残らないか（GH_TOKEN は残ること）
        run: |
          docker run --rm -u 0 \
            -e ALTEROID_RUNNER_TOKEN=raw-secret -e ALTEROID_RUNNER_PORT=4519 \
            -e ALTEROID_GOOGLE_CLIENT_ID=client-id \
            -e ALTEROID_GOOGLE_CLIENT_SECRET=client-secret \
            -e GH_TOKEN=gh-secret \
            alteroid:ci sh -eu -c '
              alteroid-runner &
              sleep 3
              env_of() { tr "\0" "\n" < /proc/$1/environ; }

              for key in ALTEROID_GOOGLE_CLIENT_ID ALTEROID_GOOGLE_CLIENT_SECRET; do
                env_of $! | grep -q "^$key=" \
                  && { echo "ログインの鍵が残っている: $key" >&2; exit 1; }
              done

              # 逆に、外の世界へ手を伸ばす鍵は**渡っていること**
              env_of $! | grep -q "^GH_TOKEN=" \
                || { echo "GH_TOKEN まで落ちている（デグレード）" >&2; exit 1; }
              exit 0
            '

      # デーモンは記憶ストアの鍵を持つ。**root で起こされても特権のまま走らない。**
      # （Railway は実行 UID を環境変数で決めるので、root で来る構成がありうる）
      #
      # **UID だけを見ても足りない。** `setpriv` は環境を変えないので、`HOME=/root` の
      # まま降りると uid は正しいのにクローンの SDK セッションが設定を書けずに落ちる
      # （「コンテナだからできない」＝north_star 禁止1）。降りた先で**実際に書けること**
      # まで見る。
      - name: デーモンは root で起こされても node へ降りるか（HOME ごと）
        run: |
          docker run --rm -u 0 alteroid:ci sh -eu -c '
            alteroidd &
            pid=$!
            sleep 3

            uid=$(awk "/^Uid:/ {print \$2}" /proc/$pid/status)
            test "$uid" = 1000 || { echo "root のまま走っている: uid=$uid" >&2; exit 1; }

            # 環境は**同じ主体からしか読めない**（docker の既定に CAP_SYS_PTRACE は
            # 無いので、root でも降りた先のプロセスは覗けない）。node で読む。
            home=$(su -s /bin/sh node -c "tr \"\\0\" \"\\n\" < /proc/$pid/environ" | sed -n "s/^HOME=//p")
            test "$home" = /home/node || { echo "HOME が降りていない: $home" >&2; exit 1; }

            # 降りた先の主体で、その HOME 配下へ実際に書けること
            su -s /bin/sh node -c "mkdir -p \"$home/.claude\" && touch \"$home/.claude/probe\"" \
              || { echo "降りた先で HOME へ書けない" >&2; exit 1; }
          '

      # **別 UID の子プロセスは runner の制御面ソケットへ繋げないことを実物で見る。**
      # `apps/runner/src/boundary.test.ts`（vitest）はこれを in-process では確かめ
      # られない — vitest プロセスは非 root で `CAP_SETUID` を持たず、`pnpm test` が
      # 走るどの環境でも別 UID の子プロセスを起こせない。ここでは器そのものの中で
      # UID を実際に分けた2プロセスを走らせ、docs/architecture.md「制御面の保護」
      # 2枚目（ソケットは mode 0600・所有者は uid 1000 のデーモン。別 UID の uid 1001
      # ＝マネージャー子プロセスの主体は connect できない）を直接見る。
      - name: 別 UID の子プロセスは runner の制御面ソケットへ繋げないか
        run: |
          docker run --rm -u 0 \
            -e ALTEROID_RUNNER_TOKEN=raw-secret \
            -e ALTEROID_RUNNER_SOCKET=/run/alteroid/runner.sock \
            -e ALTEROID_RUNNER_SOCKET_UID=1000 \
            -e ALTEROID_RUNNER_SOCKET_GID=1000 \
            alteroid:ci sh -eu -c '
              mkdir -p /run/alteroid
              alteroid-runner &
              sleep 3

              # **2つの主体が本当に別 UID かを、繋ぐ前に名乗らせる。** ここが無いと、
              # 片方の `su` の宛先を取り違えても検査は緑にも赤にもなりうるが、
              # どちらの場合も**使われていない UID の名前で結果を報告する**。実測で
              # その形を作った（下の「歯の確認」参照）: 両方を node にすると、失敗
              # メッセージは「別 UID(uid 1001)から繋がってしまった」と出たが、uid 1001
              # は一度も走っていなかった。**計器が嘘をつく形なので、計器の側で塞ぐ。**
              owner_uid=$(su -s /bin/sh node -c "id -u")
              other_uid=$(su -s /bin/sh worker -c "id -u")
              test "$owner_uid" = 1000 \
                || { echo "所有者役の uid が 1000 でない: $owner_uid" >&2; exit 1; }
              test "$other_uid" = 1001 \
                || { echo "別 UID 役の uid が 1001 でない: $other_uid" >&2; exit 1; }
              test "$owner_uid" != "$other_uid" \
                || { echo "2つの主体が同じ uid（$owner_uid）＝この検査は何も見ていない" >&2; exit 1; }

              # まず所有者（デーモン役・uid 1000 = node）からは繋がることを見る。
              # ここが繋がっていなければ、下の「別 UID から繋がらない」が
              # 「ソケットが誰からも繋がらない壊れ方」なのか「別 UID からだけ
              # 繋がらない」なのか見分けが付かない。
              su -s /bin/sh node -c \
                "curl -fsS --unix-socket /run/alteroid/runner.sock http://runner/livez" \
                >/dev/null \
                || { echo "所有者(uid 1000)からも繋がらない（前提が壊れている）" >&2; exit 1; }

              # 別 UID（worker・uid 1001 = マネージャー子プロセスの主体）からは
              # そもそも繋がらないこと。
              su -s /bin/sh worker -c \
                "curl -fsS --unix-socket /run/alteroid/runner.sock http://runner/livez" \
                >/dev/null \
                && { echo "別 UID(uid 1001)から繋がってしまった" >&2; exit 1; }
              exit 0
            '
