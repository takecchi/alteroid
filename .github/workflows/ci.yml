name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: 配布物（packages/*/dist）が CommonJS として構文解析できること（Issue #110）
        run: pnpm run check:cjs-parse

  postgres:
    name: packages/postgres (本物の Postgres + pgvector)
    runs-on: ubuntu-latest
    # roadmap.md 段階2の完了条件: 「testkit の適合テストが postgres 実装に対してすべて通る
    # （2テナント分離のテストを含む）。EXPLAIN で実際に HNSW 索引が使われることを確認する
    # 検査が通る」。擬似物での置き換えを認めない——本物の Postgres の service container に
    # 対して実行する。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Build @mnemora/core (postgres package depends on it)
        run: pnpm --filter @mnemora/core run build

      - name: Typecheck @mnemora/postgres
        run: pnpm --filter @mnemora/postgres run typecheck

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: Run postgres conformance / EXPLAIN / ADR 0011 tests against the real database
        run: pnpm --filter @mnemora/postgres run test:db

      - name: Build @mnemora/postgres
        run: pnpm --filter @mnemora/postgres run build

  example-chat:
    name: examples/chat (本物の Postgres + pgvector、擬似 provider)
    runs-on: ubuntu-latest
    # roadmap.md 段階7の完了条件: 「サンプルアプリが observe → recall の往復を実演し、
    # omitted と usage を画面またはログに可視化する」。PR 本文「サンプルアプリ自体が
    # 壊れていないことを CI で検査する」——LLM/Embedding は @mnemora/testkit の決定的な
    # 擬似 provider（OPENAI_API_KEY を設定しない）で置き換えるが、DB は擬似物で
    # 代替しない。本物の Postgres の service container に対して実行する。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Typecheck examples/chat
        run: pnpm --filter @mnemora/example-chat run typecheck

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: Run examples/chat の observe→recall 往復・量の比較テストを本物の DB に対して実行
        run: pnpm --filter @mnemora/example-chat run test:db

      - name: 北極星の物差し（会話ログを全部積むのをやめても答えが残るか）を compare で実測しログに残す
        # このジョブで唯一 OPENAI_API_KEY を設定していないため、擬似 provider で走る
        # （オーナーが CI に OPENAI_API_KEY が無いことを確認済み）。`compare` は
        # 「量を削れたか」（naive/mnemora の文字数比）だけでなく、本 PR で追加した
        # 「冒頭の事実が削った後にも残っているか」「スコープ内の何件が実際に ANN の
        # 候補になれたか（= 何件と競って絞ったか）」を表にして出力する
        # （docs/north-star.md の物差し、examples/chat/README.md
        # 「⭐ 削減率だけでは意味を持たない——答えが残っているか」節）。
        # これまでこの数値は手元で測ったきり CI では実測していなかった
        # （ADR 0021 参照）——このステップはそれを埋め、以後の変更で
        # 「削れたが答えが落ちた」への回帰をログから読めるようにする。
        run: pnpm --filter @mnemora/example-chat run compare

  root-gate-db-stage:
    name: ルートの test 門の DB 段（DATABASE_URL 在りで順方向に実測、ADR 0015）
    runs-on: ubuntu-latest
    # ADR 0015「ルートの test 門は、DB テストを『走らせなかった』と明示する」の
    # 「確かめていないこと」1・2つ目を塞ぐジョブ。
    #
    # ルートの `pnpm run test` は最後に `node scripts/run-db-tests.mjs` を呼ぶ
    # （DATABASE_URL が無ければ「実行していません」と告知して緑、在れば
    # `pnpm -r --if-present run test:db` を走らせて、落ちれば赤・通れば
    # 「✔ DB テストも実行し、通りました。」で緑になる段）。
    # `postgres` / `example-chat` ジョブは `test:db` を各パッケージに直接呼んでおり、
    # この段そのものを一度も経由しない。つまり「DATABASE_URL 在りでこの段が
    # 実際に走って緑になる」ことは、CI ではまだ誰も実測していなかった。
    # このジョブはその1点だけを測る——DB テストそのものの合否は上の2ジョブの役目のまま
    # （置き換えない）。
    #
    # 「ルートの test がこの段を呼ぶ配線」自体は、
    # scripts/__tests__/run-db-tests.test.mjs の「ルートの test 門の配線」が
    # package.json の scripts.test を静的に検査して常時押さえている。
    # ここではその配線ではなく、段そのものの実行結果（DATABASE_URL 在り・
    # 対象パッケージが全部通ったときに実際に緑になること）を実測する。
    # 歯（配線・未設定側・落ちた側）とこのジョブ（順方向の実物）とで役割を分けている。
    #
    # `pnpm run test` 全体ではなく DB 段だけを直接呼ぶ: 型検査・lint・format・
    # 各パッケージの単体テスト・build は `build` ジョブがすでに測っており、
    # ここで二重に走らせて時間を伸ばさない。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Build @mnemora/core (postgres package depends on it)
        run: pnpm --filter @mnemora/core run build

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: ルートの門の DB 段を DATABASE_URL 在りで通す（順方向の実測）
        run: |
          set -euo pipefail
          node scripts/run-db-tests.mjs 2>&1 | tee gate.log
          grep -F "DB テストを実行します" gate.log
          # 接続先の Postgres が実際に読めていること。純関数の形は
          # scripts/__tests__/db-server-description.test.mjs が測るが、
          # 「本物の DB に繋いで版が取れる」ことを測れるのは、DB を持つこのジョブだけ。
          grep -E "接続先: PostgreSQL [0-9]+" gate.log
          # CI の service container は pgvector/pgvector:pg17 なので、検証済みの版であり
          # 未検証の警告は出てはいけない。出るなら CI の版か検証済み一覧のどちらかがずれている。
          if grep -F "検証されていない版です" gate.log; then
            echo "CI の Postgres が検証済み一覧から外れている（VERIFIED_MAJOR_VERSIONS を見直すこと）" >&2
            exit 1
          fi
          grep -F "✔ DB テストも実行し、通りました。" gate.log
          if grep -F "DB テストは実行していません" gate.log; then
            echo "DB 段が未実行の側へ落ちた" >&2
            exit 1
          fi

  retrieval-quality:
    name: 想起の質を実 embedding（記録の再生）で実測し、値を残す（ADR 0088）
    runs-on: ubuntu-latest
    # ADR 0088。**ADR 0022 の「これが覆るとしたら」第1項が名指しした負債を返すジョブ。**
    #
    # ADR 0022 は「`retrieval` は本物の API キーが要るため CI には載っていない
    # （手動実行のみ）」を前提に、「想起の質の回帰を検知する歯が無い」を負債として
    # 引き受けていた。**その前提はもう成り立たない。**ADR 0051 のカセット
    # （examples/chat/cassettes/retrieval.json — 実 API の埋め込み 152 件、
    # text-embedding-3-small / 256 次元）を再生すれば、鍵なしに実 embedding の
    # 想起の質を測れる。追加コストは 0 であり、ADR 0022 が言う「安価な embedding
    # provider」に文言どおり一致する。
    #
    # ⛔ **このジョブは門ではない。**基準値と違っても落ちない。
    # 落ちるのは bench そのものが壊れたときだけ（カセットに無い入力・DB エラー・
    # 出力が壊れている）。理由は ADR 0088 §2:
    #   - decay/freshness は時刻に依存し、実行ごとに実際に揺れる（total の6桁目が動く）。
    #     見出しの数字が安定するのは similarity の変域が decay の約 10^6 倍だからで、
    #     「2 回一致した」は決定性の証明ではない。偽陽性率に上限を置けない。
    #   - 標本は probe 7 件しかない（ADR 0033 §3）。閾値の門は偽陽性を出す。
    #
    # ⚠ **`compare` ステップ（example-chat ジョブ）と同じ轍を踏まないこと。**
    # あちらは「回帰をログから読めるようにする」と約束したきり、表の中身に対する
    # assertion を1つも持たない——気づくかどうかが生ログを開くかどうかに委ねられている。
    # このジョブは値を生ログではなく **Job Summary**（PR の Checks から
    # ダウンロードなしで読める場所）へ出し、**基準値と一致していれば1行で黙り、
    # 違うときだけ展開する**。git に残るのは基準値ファイルの diff のほうである。
    timeout-minutes: 20
    # ⚠ この repo は timeout-minutes を1箇所も設定しておらず、既定は 360 分である。
    # bench 自体は数秒で終わる（手元の実測で 4.9 秒）。刺さったときに6時間燃やさない
    # ためだけの上限であり、**この1ジョブにだけ付けている**（既存ジョブへ一斉に
    # 付けるのは ADR 0088 の範囲外）。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # ⭐ **明示する。**CI には OPENAI_API_KEY が無いので既定でも recorded に落ちるが、
      # 既定に頼ると「いつか鍵が入った日」に、このジョブが黙って実 API を叩き始める
      # （decideProviderSource の既定は「キーが在れば実 API」）。ADR 0068 が
      # この明示指定を足したのは、まさにその口を塞ぐためである。
      MNEMORA_PROVIDER_SOURCE: recorded
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: 想起の質を実 embedding（記録の再生）で実測する
        # `retrieval` は DATABASE_URL を要求し、擬似物へ黙ってフォールバックしない
        # （requireDatabaseUrl）。arm を選ぶ口は無いので A/B/C の3本すべてが走る——
        # ⚠ arm A（擬似LLM+擬似埋め込み）の MRR 0.018 は実質ランダムであり、
        # これを「引けた」と読んではいけない（ADR 0022 / AGENTS.md）。
        env:
          MNEMORA_RETRIEVAL_JSON: ${{ github.workspace }}/retrieval-quality.json
        run: pnpm --filter @mnemora/example-chat run retrieval

      - name: 実測値と基準値の差分を Job Summary に残す（⛔ 門ではない）
        # このステップは基準値との相違では落ちない（exit 0）。入力そのものが
        # 壊れているときだけ非0で落ちる。ADR 0088 §2.1。
        run: |
          node scripts/retrieval-quality-summary.mjs \
            --measured "${{ github.workspace }}/retrieval-quality.json" \
            --baseline examples/chat/retrieval-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retrieval-quality
          path: retrieval-quality.json
          if-no-files-found: ignore

  identifier-probes:
    name: 識別子・固有名詞 probe（#106）を @mnemora/local-embedding で実測し、値を残す
    runs-on: ubuntu-latest
    # Issue #109（#106 由来）。`retrieval-quality` ジョブと同じく「実測値を Job Summary
    # へ残す・落とすのは bench 自体が壊れたときだけ」という形を踏襲するが、
    # **このジョブが想定する主な失敗は基準値との相違ではなく「HF からモデル重みを
    # 取得できないこと」である**。
    #
    # ⚠ **なぜ閾値の門にしないか**: ADR 0088 が `retrieval-quality` について
    # 「標本7件では偽陽性を出す」として明示的に採らなかったのと同じ理由——この bench の
    # probe は12件(識別子)・7件(日本語)であり、ADR 0033 §3 の規律に照らして統計的な
    # 閾値判定に足る母数ではない。probe を増やした後、別途測ってから決める段取りである。
    #
    # 🔴 **ただし「重みを取得できなかった」ときは、このジョブ自体を意図して失敗させる**
    # ——`identifier-probes` サブコマンドは `warmup()` が失敗したらメトリクスを1件も
    # 出さずに `process.exitCode = 1` で終わる仕様であり(`local-embedding-warmup.ts`)、
    # それをこのジョブでも尊重する(揉み消さない)。measure ステップが失敗しても、
    # 後続の summary/artifact ステップは `if: always()` で必ず走り、「重みが取得
    # できなかった」ことを Job Summary に明示する(`buildSummaryMarkdown` の
    # `weights_unavailable` 分岐)。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # `LocalEmbeddingProvider` はモデル重みの取得先を選ぶ鍵を要求しない
      # (`@mnemora/local-embedding` は外部サービスへ繋がない、ADR 0085)——
      # `MNEMORA_PROVIDER_SOURCE`/`OPENAI_API_KEY` はこのジョブに関係が無い。
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # 実測（この作業を行った器）では transformers.js の既定キャッシュは
        # `node_modules/.pnpm/@huggingface+transformers@4.2.0/.../.cache/` に落ちた。
        # ⚠ CI ランナーでは同じ場所とは限らない（pnpm のバージョン・store の位置に依存する）
        # ため、`MNEMORA_LOCAL_EMBEDDING_CACHE_DIR`（`examples/chat/src/providers.ts` が
        # `LocalEmbeddingProvider` の `cacheDir` オプションへそのまま渡す——**使うだけで
        # `@mnemora/local-embedding` 自体は変更していない**）で場所を明示的に固定する。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-ruri-v3-30m-q8-v1

      - name: 識別子・固有名詞 probe（#106）を @mnemora/local-embedding で実測する
        # ⚠ **`continue-on-error: true` にしない。**重みを取得できなかった run は
        # このジョブが赤くなること自体が仕様である（メトリクスを出さずに落ちる）。
        # 後続の summary/artifact ステップだけを `if: always()` で必ず走らせる。
        env:
          MNEMORA_IDENTIFIER_PROBE_JSON: ${{ github.workspace }}/identifier-probe.json
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: pnpm --filter @mnemora/example-chat run identifier-probes

      - name: 実測値と基準値の差分、または「重みが取得できなかった」ことを Job Summary に残す（⛔ 門ではない）
        # このステップは常に走る（`if: always()`）——measure ステップが重み取得失敗で
        # 落ちても、その理由を Job Summary へ出すのはこのステップの役目である。
        # `identifier-probe-summary.mjs` 自体は「入力そのものが壊れている」ときだけ
        # 非0で終わる(JSON が読めない/parse できない/形が想定と違う。--baseline を
        # 渡していて、それが読めない/壊れている場合も含む)。
        #
        # 🔴 **`--baseline` を渡す。**「⛔ 門にしない」と「⛔ 基準値と比べない」は
        # 別のことである——ADR 0088 §3 は両方を同時にやっている（差分を Job Summary に
        # 出し、かつ相違では落とさない）。基準値がコミットされているのに誰も比べないなら、
        # 値が動いても誰も気づかず、誰も基準値を更新せず、⟹ 新しい値が PR の diff に
        # 現れる輪が閉じない（ADR 0094 §8 / ADR 0088 §3 が名指しした形の再発）。
        # 一致していれば1行で黙り、違うときだけ展開する。
        #
        # ⚠ `status: "weights_unavailable"` のときは、--baseline を渡していても
        # 比較を1つも出さない——⛔ 「測れなかった」を「基準値と違う」に化けさせない。
        if: always()
        run: |
          node scripts/identifier-probe-summary.mjs \
            --measured "${{ github.workspace }}/identifier-probe.json" \
            --baseline examples/chat/identifier-probe-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: identifier-probe
          path: ${{ github.workspace }}/identifier-probe.json
          if-no-files-found: ignore

  consolidation-cost:
    name: Runtime.consolidate() が「載る量」に効くかを実測し、値を残す（Issue #136）
    runs-on: ubuntu-latest
    # Issue #136。`identifier-probes` ジョブと同じ体裁を踏襲する——`retrieval-quality`/
    # `identifier-probes` が確立した「実測値を Job Summary へ残す・落とすのは bench 自体が
    # 壊れたときだけ」という形（ADR 0088）。
    #
    # ⚠ **なぜ閾値の門にしないか**: 標本は probe 7件・haystack由来の filler 群であり、
    # ADR 0033 §3 の規律（標本7件からは失敗率も成功率も主張しない）にそのまま照らせば
    # 閾値判定に足る母数ではない。`retrieval-quality`/`identifier-probes` と同じ判断。
    #
    # 🔴 **ただし「重みを取得できなかった」ときは、このジョブ自体を意図して失敗させる**
    # ——`consolidation-cost` サブコマンドも `warmup()` が失敗したらメトリクスを1件も
    # 出さずに `process.exitCode = 1` で終わる（`local-embedding-warmup.ts` を共有）。
    # measure ステップが失敗しても、後続の summary/artifact ステップは `if: always()` で
    # 必ず走る。
    #
    # ⛔ **これは想起の質の門でも、統合の質の門でもない。**この bench が測るのは
    # 「載る量」（`store`/`recall.*.usage` の実測）と「そもそも縮んだか」であって、
    # `deterministic` LLM が作る統合結果の意味的な良し悪しではない
    # （AGENTS.md「`deterministic` で測った想起の質は、性能について何も言っていない」）。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # `LocalEmbeddingProvider` はモデル重みの取得先を選ぶ鍵を要求しない
      # (`@mnemora/local-embedding` は外部サービスへ繋がない、ADR 0085)。
      # `consolidate()` は LLM も呼ぶが、`deterministic` に固定するため
      # `MNEMORA_PROVIDER_SOURCE`/`OPENAI_API_KEY` はこのジョブに関係が無い
      # （`RecordedLLMProvider` はカセットに統合プロンプトを持たないため使えない——
      # examples/chat/README.md「consolidation-cost」節参照）。
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # `identifier-probes` ジョブと同じキー空間を使う——同じモデル
        # （`sirasagi62/ruri-v3-30m-ONNX`、既定 dtype）を使うため、キャッシュを分ける理由が無い。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-ruri-v3-30m-q8-v1

      - name: Runtime.consolidate() の「載る量」を実測する
        # ⚠ **`continue-on-error: true` にしない。**重みを取得できなかった run は
        # このジョブが赤くなること自体が仕様である（メトリクスを出さずに落ちる）。
        env:
          MNEMORA_CONSOLIDATION_JSON: ${{ github.workspace }}/consolidation-cost.json
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: pnpm --filter @mnemora/example-chat run consolidation-cost

      - name: 実測値と基準値の差分を Job Summary に残す（⛔ 門ではない）
        # このステップは常に走る（`if: always()`）——measure ステップが重み取得失敗で
        # 落ちても、その理由を Job Summary へ出すのはこのステップの役目である。
        # `consolidation-cost-summary.mjs` 自体は「入力そのものが壊れている」ときだけ
        # 非0で終わる。
        if: always()
        run: |
          node scripts/consolidation-cost-summary.mjs \
            --measured "${{ github.workspace }}/consolidation-cost.json" \
            --baseline examples/chat/consolidation-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: consolidation-cost
          path: ${{ github.workspace }}/consolidation-cost.json
          if-no-files-found: ignore
