name: storage-pg を本物の PostgreSQL で

# **storage-pg のテストを、PGlite ではなく本物の PostgreSQL で走らせる**（#2918）。
#
# 既定の CI（`ci.yml`）は storage-pg を全部 PGlite（プロセス内の PostgreSQL）で
# 走らせる。PGlite と本物の差（照合順・NUL・timestamp・bigint の文字列化）で、本番
# （Railway の PostgreSQL）だけ壊れうる。ここは同じテストファイルを
# `ALTEROID_TEST_PG_URL` で本物へ向けて走らせる（テストは複製しない。口は
# `packages/storage-pg/src/test-db.test-support.ts`）。
#
# **範囲:** `packages/storage-pg/src/*.test.ts` のうち、`test-db.test-support.ts`（`createMigratedTestDb` /
# `createEmptyTestDb`）を import するファイルすべて（#2937）。**ファイル名は列挙せず、import で
# 拾う**——storage-pg のテストを `createMigratedTestDb` で書けば自動でここに乗る（追加漏れが
# 起きない）。拾われないのは PGlite 固有のもの（`migrate.test.ts` と `pglite-template.test.ts`。
# どちらも本物へ向ける口を使わない）だけで、新しい PGlite 直結のテストを足すと、ここには
# 乗らない。共通の約束テスト（`packages/core/src/*-contract.ts` の契約関数）を呼ぶ
# `index.*.test.ts` もこの中に入る。本物で落ちる歯は一覧にして Issue へ書き、テストの側で
# `skipIf` にしてある（#2922、#2937）。
#
# **必須チェックではない。** `ci` / `image` / `no-attribution-trailers`（正本は
# `.github/required-status-checks.json`）の構成は変えていない。`ci` の `needs` にも
# 入れていない（別 workflow にしてあるので、`ci` の所要時間も増えない）。
#
# **いつ走るか:** main への push・毎晩（`ci.yml` の定時の少し後）・手動、
# それと PR のうち storage-pg / 契約関数 / このファイルに触れたものだけ。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/storage-pg/**'
      - 'packages/core/src/*-contract.ts'
      - '.github/workflows/storage-pg-real-postgres.yml'
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.head_ref || github.run_id }}
  # main の push では走っている実行を切らない（ci.yml の concurrency の doc と同じ理由。Issue #3540）
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  real-postgres:
    # draft の PR では回さない（`ci.yml` の `ci` と同じ判断）。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: real-postgres (${{ matrix.collate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 本番の照合順は en_US.UTF-8 でありうる（PGlite は C 相当）。両方で見る。
        collate: ['en_US.UTF-8', 'C']
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: alteroid
      PGPASSWORD: alteroid-ci-throwaway
    steps:
      - uses: actions/checkout@v7

      # **postgres は、まず GHCR の写し（`mirror-base-images.yml`）から取り、取れなければ ECR Public から取る。**
      # 本番に近い版。リポジトリの `Dockerfile` の postgres（17）に揃える。中身は同じ公式像（#4390）。
      # Docker Hub は匿名の取得制限に当たっていた（#4383）。ECR Public も 429 を返す回がある（#4654）。
      # サービスコンテナ（`services:`）にしない: 取り元を切り替えられず、取れないと Initialize containers で job ごと落ちるため。
      # 資格情報はこのジョブの中だけで使い捨てる値で、秘密ではない。
      - name: postgres を起こす（GHCR の写し → 取れなければ ECR Public）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          MIRROR: ghcr.io/${{ github.repository_owner }}/alteroid-mirror
        run: |
          set -eu
          # ログインに失敗しても止めない: 写しが読めないだけで、ECR Public へ戻れば済むため
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin || true
          image=''
          for candidate in "$MIRROR/postgres:17" public.ecr.aws/docker/library/postgres:17; do
            for attempt in 1 2; do
              if docker pull "$candidate"; then
                image=$candidate
                break 2
              fi
              echo "取れなかった（$attempt 回目）: $candidate" >&2
              sleep 30
            done
          done
          test -n "$image" || { echo "postgres の像をどこからも取れなかった" >&2; exit 1; }
          echo "取り元: $image"
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=alteroid -e POSTGRES_PASSWORD=alteroid-ci-throwaway "$image"
          # TCP で確かめる: 初期化の途中の一時サーバーは Unix ソケットだけで待ち受けるので、TCP で答えたら本番のサーバーである
          for i in $(seq 1 60); do
            if docker exec postgres pg_isready -U alteroid -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "postgres が2分で起き上がらなかった" >&2
          exit 1

      - uses: ./.github/actions/setup

      # 照合順を指定した DB を作る（`template0` から。`template1` は照合順を変えられない）。
      - name: 照合順 ${{ matrix.collate }} の DB を作る
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "create database alteroid_test template template0 encoding 'UTF8' lc_collate '${{ matrix.collate }}' lc_ctype '${{ matrix.collate }}'"
          psql -d postgres -At -c "select version()"
          psql -d postgres -At -c "select datname, datcollate, datctype from pg_database where datname = 'alteroid_test'"

      - run: pnpm --filter @alteroid/core build

      - name: storage-pg のテストを本物の PostgreSQL で走らせる
        env:
          ALTEROID_TEST_PG_URL: postgres://alteroid:alteroid-ci-throwaway@127.0.0.1:5432/alteroid_test
          ALTEROID_TEST_PG_EXPECT_COLLATE: ${{ matrix.collate }}
        run: |
          # `test-db.test-support` を import するテストを拾う（範囲は冒頭のコメント）。
          files=$(grep -l "test-db\.test-support" packages/storage-pg/src/*.test.ts)
          test -n "$files" || { echo "対象のテストが1本も見つからない" >&2; exit 1; }
          echo "$files" | wc -l
          # vitest のフィルタは部分一致なので、拡張子まで含めた相対パスで渡す。
          pnpm --filter @alteroid/storage-pg test $(echo "$files" | sed "s#^packages/storage-pg/##")
