<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    `packages/ui/src/components/layout/brand-mark.tsx` の記号（サイドバー左上の印）を書き出したもの。
    形を変えるときは両方を直すこと。

    タブの地は画面のテーマではなくブラウザ側の明暗で決まるので、色は `prefers-color-scheme` で切り替える。
    値は `packages/ui/src/styles.css` の foreground / primary の変数（明るい側は `:root`、暗い側は `.dark`）。
    この注釈の中にハイフン2つの並びを書かないこと。XML の注釈では禁止で、ファイルごと壊れて
    ブラウザがタブに何も描かない（`app/public-svg-well-formed.test.ts` が測る）。
  -->
  <style>
    .fg { stroke: oklch(0.22 0.03 275); }
    .primary-fill { fill: oklch(0.49 0.2 285); }
    .primary-stroke { stroke: oklch(0.49 0.2 285); }
    @media (prefers-color-scheme: dark) {
      .fg { stroke: oklch(0.94 0.012 280); }
      .primary-fill { fill: oklch(0.8 0.12 285); }
      .primary-stroke { stroke: oklch(0.8 0.12 285); }
    }
  </style>
  <defs>
    <clipPath id="clone">
      <circle cx="14.5" cy="12" r="6.5" />
    </clipPath>
  </defs>
  <circle cx="9.5" cy="12" r="6.5" clip-path="url(#clone)" class="primary-fill" />
  <circle cx="9.5" cy="12" r="6.5" class="fg" stroke-width="1.5" />
  <circle cx="14.5" cy="12" r="6.5" class="primary-stroke" stroke-width="1.5" stroke-dasharray="2.2 1.8" />
</svg>
