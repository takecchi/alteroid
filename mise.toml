# 実行系の版をここで一本化する（mise）。
#
# 「ローカルでは動く」を無くすのが目的なので、ローカルと CI は同じここを読む
# （CI は .github/workflows/ci.yml の jdx/mise-action がこのファイルを使う）。
# 版を上げるときは以下も一緒に見ること — ずれたら「環境によってできない」が
# 生まれ、それは仕様ではなくバグである:
#   - package.json の `packageManager`
#   - Dockerfile の `FROM node:`（build / runtime の2箇所）
#   - pnpm-workspace.yaml の catalog `@types/node`
#   - package.json と apps/web/package.json の `engines.node`（`22.x`）
#
# Vercel（apps/web の本番）の Node の版も、この `engines.node` で揃える
# （Issue #791）。Vercel は Root Directory の package.json の `engines.node` を
# 管理画面（Project Settings）の値より優先する。以前は `">=22"` で上限が無く、
# 管理画面の 24.x（2026-09-11 にオーナーが読んだ値）がそのまま使われていた
# ——CI が本番の Web の実 major を一度も踏んでいない形だった。Root Directory が
# repo の根か apps/web かを repo からは確かめられないので、両方に書いてある。
# ⚠ Vercel が 22.x を切ったら、ここと mise.toml を一緒に上げること。
# catalog の `@types/node` は ^22.20.1（22系）で、実機と揃う。
[tools]
node = "22.23.2"
pnpm = "11.27.1"
