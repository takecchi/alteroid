# ローカルと同じものを、コンテナ + PostgreSQL で常駐させる（roadmap M4）。
#
#   claude setup-token          # 長期トークンを取る（人間が一度だけ）
#   TOKEN=$(openssl rand -hex 32)
#   cat > .env <<EOF
#   CLAUDE_CODE_OAUTH_TOKEN=...
#   POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   ALTEROID_RUNNER_TOKEN=$TOKEN
#   ALTEROID_RUNNER_TOKEN_SHA256=$(printf %s "$TOKEN" | shasum -a 256 | cut -d' ' -f1)
#   EOF
#   docker compose up -d
#   docker compose exec app alteroid chat
#
# マネージャーに「実装して PR を出して」と頼むなら、同じ `.env` に GitHub の鍵と
# コミットの身元も足す（runner へ渡る。無ければ公開リポジトリの clone だけができる）:
#
#   GH_TOKEN=github_pat_...      # fine-grained PAT: Contents RW / Pull requests RW
#   GIT_AUTHOR_NAME=...
#   GIT_AUTHOR_EMAIL=...
#   GIT_COMMITTER_NAME=...
#   GIT_COMMITTER_EMAIL=...
#
# 通っているかは**マネージャーと同じ主体**で確かめる（root で通っても意味がない）:
#
#   docker compose exec -u 1001 runner gh auth status
#

# runner に渡すのが**ハッシュだけ**なのは、runner の中で走るマネージャーが
# `/proc/1/environ` を読んでも鍵を作れないようにするためである。
#
# ## なぜ3つに分かれているか
#
# ```
#   app（デーモン・uid 1000）──── db（PostgreSQL）   ← data ネットワーク
#     ├ クローン（Fable）                             記憶・日誌・ジョブ・生ログ
#     └ 記憶ストアの鍵と、runner の合鍵を持つ**唯一の**プロセス
#     │  Unix ソケット（共有 volume。mode 0600 / owner uid 1000）
#     └───────────── runner（root）
#                      └ マネージャー（Opus）＋作業者（Sonnet）は **uid 1001**
#                        ├ workspace / MCP 設定 / OAuth トークン
#                        └ **記憶ストアの鍵も、DB への経路も、制御面の鍵も持たない**
# ```
#
# 同じ器で走らせている限り、マネージャーは `/proc/1/environ` からデーモンの環境
# 変数（＝DB 接続情報）を読める。ツールを削って塞ぐのは禁止（north_star 禁止2）
# なので、**実行環境を分けて**塞ぐ。
#
# **制御面（runner API）もマネージャーから触らせない。** 触れると、自分宛の許可確認に
# 自分で `allow` を返せてしまう（クローンも人間も通らない迂回路）。3枚で塞いである:
#
# 1. runner は TCP を開かない。待ち受けは共有 volume 上の Unix ソケットだけ
# 2. そのソケットは mode 0600 / owner uid 1000（デーモン）。uid 1001 の子は繋げない
# 3. runner が持つのは合鍵の sha256 だけ。読めても鍵は作れない
#
# ネットワークも分けてあるので、runner から db への経路はそもそも存在しない。
#
# **待ち受けは 127.0.0.1 のまま、ポートも公開しない。** クローンへ話しかける口は
# 叩けばターンが起きる実行の口なので、外に出すなら手前に境界（認証・トンネル・
# リバースプロキシ）を置くのが先である。中から使うなら exec で足りる。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alteroid
      # 既定値を置かない。置けば「compose を読めば入れる」DB になる。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?推測できない値を .env に置くこと}
      POSTGRES_DB: alteroid
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alteroid -d alteroid']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    restart: unless-stopped

  # manager-runner — SDK（マネージャーと作業者）を隔離して走らせる。
  # **ここに記憶ストアの鍵を足さないこと。** 足した瞬間、分離した意味が消える。
  runner:
    build: .
    command: ['node', 'apps/runner/dist/index.js']
    # **root で走らせる。** 子プロセス（マネージャーと作業者）を uid 1001 へ降ろす
    # のに特権が要るためで、権限を配るためではない。降りた先の worker は非特権である。
    user: root
    # **リスト形式で書いている。** `GH_TOKEN` と `GIT_*` は「置かれていなければ
    # 渡さない」でなければならず、マップ形式の `${VAR:-}` だと未設定を空文字にして
    # しまう（空の `GIT_AUTHOR_NAME` は git を `empty ident name` で落とす＝未設定より悪い）。
    # 値なしで名前だけ並べた行は、シェルと `.env` のどちらかにあれば渡り、無ければ
    # 未設定のまま container へ入る。
    environment:
      # 安定した識別子。台帳の `manager_id → runner_id` はこれで引く
      # （器を作り直しても同じ宛先として戻る）。
      - ALTEROID_RUNNER_ID=${ALTEROID_RUNNER_ID:-runner-primary}
      # **TCP を開かない。** 待ち受けは共有 volume の Unix ソケットだけなので、
      # 同じ器のマネージャーから `curl http://127.0.0.1:...` の宛先が存在しない。
      - ALTEROID_RUNNER_SOCKET=/run/alteroid/runner.sock
      # ソケットの持ち主はデーモン（uid 1000）。mode 0600 なので uid 1001 は繋げない。
      - ALTEROID_RUNNER_SOCKET_UID=1000
      - ALTEROID_RUNNER_SOCKET_GID=1000
      # 制御面の合鍵は**ハッシュだけ**。読めても鍵は作れない。
      - ALTEROID_RUNNER_TOKEN_SHA256=${ALTEROID_RUNNER_TOKEN_SHA256:?openssl rand -hex 32 の sha256 を .env に置くこと}
      # 貸し出し期限（秒。既定 30 / `off` で無効）。この時間デーモンから `GET /health`
      # が届かなければ、器は**自分で**走行中のセッションを畳む。
      #
      # **これが無いと、落ちて見えた器の仕事を別の器へ移せない。** 生存確認が途絶えた
      # ことは器が死んだことを意味しない（ネットワークだけが切れて、中のマネージャーは
      # 走り続けている）。その状態で同じ session を別の器で開くと、同じ workspace への
      # 二重書きと、PR 作成のような取り消せない操作の二重実行が起きる。デーモンはこの
      # 期限を根拠にしてしか自動では移さない（`off` にした器の仕事は人間の確認待ちになる）。
      #
      # 能力の制限ではない。ターン数のような人工上限ではなく、「デーモンに繋がっていない
      # 器はセッションを持ち続けない」という実行環境の境界である（north_star 禁止2）。
      - ALTEROID_RUNNER_LEASE_TTL=${ALTEROID_RUNNER_LEASE_TTL:-30}
      # 期限が切れてから**畳み終わる**までに要りうる時間（秒。既定 5）。デーモンは
      # 期限＋この申告ぶん待ってから移送する。**実際に畳むのにかかる時間より短く
      # しないこと** — 短いと、デーモンが「もう止まっている」と見なした後もセッションが
      # 動いている窓ができる（長くする分には移送が遅くなるだけで安全側）。
      - ALTEROID_RUNNER_LEASE_GRACE=${ALTEROID_RUNNER_LEASE_GRACE:-5}
      # 認証はサブスクリプションの長期トークン（claude setup-token）。
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token で取得して .env に置くこと}
      - TZ=${TZ:-Asia/Tokyo}
      # マネージャーが GitHub を触るための鍵と、コミットの身元。**runner に置くのが
      # 正しい。** 記憶ストアの鍵（伏せる）と違って、これは**下＝外の世界へ手を伸ばす
      # 鍵**であり、伏せると人間が Claude Code でできる `gh pr create` が層を下りた
      # 瞬間にできなくなる（デグレード。north_star 禁止1）。
      #
      # 無くても壊れない。公開リポジトリの clone は鍵なしで通り、**push と PR 作成に
      # だけ要る**。`GIT_*` を `git config` ではなく環境変数で渡すのは、器を作り直す
      # たびに設定が消えるからである（置き忘れると commit が
      # `Please tell me who you are` で失敗する）。
      - GH_TOKEN
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
    volumes:
      # マネージャーが実際に触るプロジェクト。人間が Claude Code を開く場所と同じ
      # 意味を持つ。**MCP 設定（.mcp.json）もここに置く** — cwd がこの場所なので、
      # 人間が使っているのと同じ連携がマネージャーからも見える（下向きの可視性）。
      # 既定は名前付き volume（uid 1001 の所有で初期化される）。ホストのディレクトリを
      # 使うなら、その所有者を uid 1001 に揃えること。
      - ${ALTEROID_WORKSPACE_HOST:-workspace}:/workspace
      - control:/run/alteroid
    healthcheck:
      # 生存確認だけの口（制御面の情報は返さない）。ソケット越しに叩く。
      test:
        [
          'CMD-SHELL',
          'curl -fsS --unix-socket /run/alteroid/runner.sock http://runner/livez || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    # 走行中のマネージャーを畳み、生ログをデーモンへ渡し切る時間。
    stop_grace_period: 60s
    networks: [control]
    restart: unless-stopped

  # 2台目の manager-runner（roadmap M5）。**既定では起きない。**
  #
  #   docker compose --profile scale up -d
  #
  # 増やしても、能力もプロトコルも1台構成と同じままである（名簿が宛先を選ぶだけ）。
  # 器ごとに違うのは3つだけ: 安定した識別子・ソケットの名前・workspace の volume。
  #
  # **器が落ちた委譲を別の器へ移したいなら、workspace の運用を選ぶこと**（既定の
  # runner-volume は器ごとに別の volume なので移せない。移せないことは人間へ報告
  # されるが、報告で作業は戻らない）。app の `ALTEROID_WORKSPACE_KIND` を見よ。
  runner-b:
    profiles: [scale]
    build: .
    command: ['node', 'apps/runner/dist/index.js']
    user: root
    environment:
      - ALTEROID_RUNNER_ID=${ALTEROID_RUNNER_B_ID:-runner-b}
      # ソケットは器ごとに別の名前にする（同じ control volume の上に並ぶ）。
      - ALTEROID_RUNNER_SOCKET=/run/alteroid/runner-b.sock
      - ALTEROID_RUNNER_SOCKET_UID=1000
      - ALTEROID_RUNNER_SOCKET_GID=1000
      # 合鍵は**全 runner で同じ sha256**。制御面の本人確認はデーモンかどうかの
      # 判定であって、器を区別するためのものではない。
      - ALTEROID_RUNNER_TOKEN_SHA256=${ALTEROID_RUNNER_TOKEN_SHA256:?openssl rand -hex 32 の sha256 を .env に置くこと}
      # 期限も全 runner で揃える（デーモンは器ごとの申告を見るが、揃っていない構成は
      # 人間が読めなくなる）。
      - ALTEROID_RUNNER_LEASE_TTL=${ALTEROID_RUNNER_LEASE_TTL:-30}
      - ALTEROID_RUNNER_LEASE_GRACE=${ALTEROID_RUNNER_LEASE_GRACE:-5}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token で取得して .env に置くこと}
      - TZ=${TZ:-Asia/Tokyo}
      - GH_TOKEN
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
    volumes:
      # 既定は器ごとの volume。共有 FS で運用するなら、ここを runner と同じ volume に
      # して app に `ALTEROID_WORKSPACE_KIND=shared-volume` を置く（同じ木を複数の
      # マネージャーが触ることになる点は、人間が1つの作業ツリーを使い回すのと同じ）。
      - ${ALTEROID_WORKSPACE_B_HOST:-workspace-b}:/workspace
      - control:/run/alteroid
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --unix-socket /run/alteroid/runner-b.sock http://runner/livez || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
    networks: [control]
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_healthy
    environment:
      # 記憶・日誌・ジョブ・セッションの置き場。**この鍵はデーモンだけが持つ。**
      ALTEROID_DATABASE_URL: postgres://alteroid:${POSTGRES_PASSWORD}@db:5432/alteroid
      # 委譲先の名簿。固定 URL をコードに埋めず、ここで登録する。
      #
      # 2台目を起こすなら、`.env` で宛先を並べる（カンマ区切り）:
      #   ALTEROID_RUNNER_URLS=unix:/run/alteroid/runner.sock,unix:/run/alteroid/runner-b.sock
      #
      # 名乗りを返さない器が混ざっていても、デーモンは残りで走り、返るように
      # なった時点でその器も使う（1台の不在で全部を止めない）。
      ALTEROID_RUNNER_URLS: ${ALTEROID_RUNNER_URLS:-unix:/run/alteroid/runner.sock}
      # workspace の運用選択（M5）。器が落ちた委譲を別の器で続けられるかが決まる。
      #   runner-volume（既定）… 器ごとの volume。移せない（失われたことは報告される）
      #   shared-volume        … 全 runner が同じパスで同じ FS を見ている前提
      #   git                  … マネージャー自身が clone し直して続ける
      ALTEROID_WORKSPACE_KIND: ${ALTEROID_WORKSPACE_KIND:-runner-volume}
      ALTEROID_WORKSPACE_REPOSITORY: ${ALTEROID_WORKSPACE_REPOSITORY:-}
      ALTEROID_WORKSPACE_REF: ${ALTEROID_WORKSPACE_REF:-main}
      # 制御面の合鍵。**素の値を持つのはデーモンだけ**（runner はハッシュのみ）。
      ALTEROID_RUNNER_TOKEN: ${ALTEROID_RUNNER_TOKEN:?openssl rand -hex 32 で作って .env に置くこと}
      # クローン（Fable）も SDK セッションなので、こちらにも認証が要る。
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token で取得して .env に置くこと}
      # 自律の既定（日報・発意）は環境変数で開け閉めできる。これは方針であって
      # 実行回数の制限ではない（north_star 禁止2）。
      ALTEROID_DAILY_REPORT_AT: ${ALTEROID_DAILY_REPORT_AT:-22:00}
      ALTEROID_INITIATIVE_EVERY: ${ALTEROID_INITIATIVE_EVERY:-60}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      # state（daemon.json）だけ。記憶は PostgreSQL 側にある。
      - state:/data/alteroid
      # runner への口（Unix ソケット）。**runner の workspace は覗かない。**
      - control:/run/alteroid
    # 落ちる前の最後の蒸留（クローンのターン1本）が終わるまで待つ。既定の 10 秒だと
    # 途中で SIGKILL され、記憶へ移すはずだったものが消える（蒸留は生存条件）。
    stop_grace_period: 60s
    # data で db へ、control で runner へ。**runner は data に居ない**ので、
    # 鍵を手に入れても DB への経路が無い。
    networks: [data, control]
    restart: unless-stopped

networks:
  data:
  control:

volumes:
  db:
  state:
  workspace:
  # 2台目の runner の作業場所（`--profile scale` のときだけ使われる）
  workspace-b:
  # デーモンと runner の間の口（Unix ソケット）だけを置く場所
  control:
