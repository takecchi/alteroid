# ローカルと同じものを、コンテナ + PostgreSQL で常駐させる（M4）。
#
#   cp .env.example .env        # 3つ埋める（下記）
#   docker compose up -d
#   docker compose exec app alteroid chat
#
# `.env` に要るのは3つだけである:
#
#   CLAUDE_CODE_OAUTH_TOKEN=... # claude setup-token（人間が一度だけ）
#   ALTEROID_RUNNER_TOKEN=...   # openssl rand -hex 32。**app と runner で同じ値**
#   POSTGRES_PASSWORD=...       # openssl rand -hex 16
#
# マネージャーに「実装して PR を出して」と頼むなら、同じ `.env` に GitHub の鍵と
# コミットの身元も足す（無ければ公開リポジトリの clone だけができる）:
#
#   GH_TOKEN=github_pat_...      # fine-grained PAT: Contents RW / Pull requests RW
#   GIT_AUTHOR_NAME=...
#   GIT_AUTHOR_EMAIL=...
#   GIT_COMMITTER_NAME=...
#   GIT_COMMITTER_EMAIL=...
#
# 外から HTTP API を叩かせるなら、Google ログインを有効にする（同じ `.env` へ）。
# ログインしただけでは使えない — 許可は人間が CLI から与える:
#
#   ALTEROID_GOOGLE_CLIENT_ID=...apps.googleusercontent.com
#   ALTEROID_GOOGLE_CLIENT_SECRET=...
#   ALTEROID_PUBLIC_URL=https://alteroid.example    # 外から届く起点
#
#   docker compose exec app alteroid access list          # 誰がログインしたか
#   docker compose exec app alteroid access grant <id>    # 使えるようにする
#
# Google 側に登録する Redirect URI は `<ALTEROID_PUBLIC_URL>/auth/google/callback`
# の1本だけでよい。**この2つの鍵は app にだけ渡る**（runner へ降ろすと、その中の
# マネージャーが鍵を読んで自分でトークンを発行できてしまう）。
#
# 通っているかは**マネージャーと同じ主体**で確かめる（root で通っても意味がない）:
#
#   docker compose exec -u 1001 runner gh auth status
#
#
# ## 環境変数は app と runner で同じでよい（違うのは1つだけ）
#
# 下の `x-shared-env` を両方の役へ丸ごと渡している。**役ごとに違うのは
# `ALTEROID_DATABASE_URL`（記憶ストアの鍵）だけ**で、それは app にしか無い。
# 使う / 使わないは役が決めればよく、人間が2か所に別々の値を置く必要は無い。
#
# **合鍵も「同じ値を置くだけ」である。** runner は起動時（`docker/alteroid-runner`）に
# sha256 へ畳み、素の値を自分の環境から落としてから node を exec する。だから
# runner のプロセスに素の鍵は残らない — 守りは1枚も減っていない（下記3枚目）。
#
# ## なぜ3つに分かれているか
#
# ```
#   app（デーモン・uid 1000）──── db（PostgreSQL）   ← data ネットワーク
#     ├ クローン（Fable）                             記憶・日誌・ジョブ・生ログ
#     └ 記憶ストアの鍵を持つ**唯一の**プロセス
#     │  Unix ソケット（共有 volume。mode 0600 / owner uid 1000）
#     └───────────── runner（root）
#                      └ マネージャー（Opus）＋作業者（Sonnet）は **uid 1001**
#                        ├ workspace / MCP 設定 / OAuth トークン
#                        └ **記憶ストアの鍵も、DB への経路も、素の合鍵も持たない**
# ```
#
# 同じ器で走らせている限り、マネージャーは `/proc/1/environ` からデーモンの環境
# 変数（＝DB 接続情報）を読める。ツールを削って塞ぐのは禁止（north_star 禁止2）
# なので、**実行環境を分けて**塞ぐ。
#
# **制御面（runner API）もマネージャーから触らせない。** 触れると、自分宛の許可確認に
# 自分で `allow` を返せてしまう（クローンも人間も通らない迂回路）。3枚で塞いである:
#
# 1. runner は TCP を開かない。待ち受けは共有 volume 上の Unix ソケットだけ
# 2. そのソケットは mode 0600 / owner uid 1000（デーモン）。uid 1001 の子は繋げない
# 3. runner のプロセスに残るのは合鍵の sha256 だけ。読めても鍵は作れない
#
# ネットワークも分けてあるので、runner から db への経路はそもそも存在しない。
#
# **待ち受けは 127.0.0.1 のまま、ポートも公開しない。** クローンへ話しかける口は
# 叩けばターンが起きる実行の口なので、外に出すなら手前に境界（認証・トンネル・
# リバースプロキシ）を置くのが先である。中から使うなら exec で足りる。

# app と runner で共通の環境変数。**ここに記憶ストアの鍵を足さないこと** —
# 足した瞬間、runner の中の子プロセス（＝マネージャー）が同じ鍵に届く。
#
# **そして、ここを増やす前に実行環境プロファイルを検討すること**
# （`docker compose exec app alteroid profile edit`）。道具の鍵や PATH をここへ
# 足すと、1つ増えるたびに器を焼き直すことになる＝「環境を直す」と「走行中の仕事を
# 失う」が同じ操作になる。プロファイルは記憶ストア側に置かれ、器を作り直さずに
# 差し替えられる（これから起こす仕事には即座に。走行中の仕事は gh / git が
# 次の呼び出しから拾う）。
# ここに残すのは**プロファイルが降りる前から要るもの**だけでよい。
x-shared-env: &shared-env
  # 制御面の合鍵。**両方に同じ値を置くだけでよい。** runner は起動時に sha256 へ
  # 畳んで素の値を落とす（`docker/alteroid-runner`）。
  ALTEROID_RUNNER_TOKEN: ${ALTEROID_RUNNER_TOKEN:?openssl rand -hex 32 で作って .env に置くこと}
  # 委譲の宛先（app が読む）と、その待ち受け（runner が読む）。同じ口の裏表なので
  # 並べて置く。相手側は読まないだけで、害は無い。
  ALTEROID_RUNNER_URL: unix:/run/alteroid/runner.sock
  ALTEROID_RUNNER_SOCKET: /run/alteroid/runner.sock
  # ソケットの持ち主はデーモン（uid 1000）。mode 0600 なので uid 1001 は繋げない。
  ALTEROID_RUNNER_SOCKET_UID: '1000'
  ALTEROID_RUNNER_SOCKET_GID: '1000'
  # 安定した識別子。台帳の `manager_id → runner_id` はこれで引く
  # （器を作り直しても同じ宛先として戻る）。
  ALTEROID_RUNNER_ID: ${ALTEROID_RUNNER_ID:-runner-primary}
  # 認証はサブスクリプションの長期トークン（claude setup-token）。クローンも
  # マネージャーも SDK セッションなので、両方に要る。
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token で取得して .env に置くこと}
  # 層とモデル帯の対応（クローン Fable / マネージャー Opus / 作業者 Sonnet）を
  # 差し替えるための置き場。**これは設定ではなく、人間の承認の置き場である** —
  # 対応は設計判断であり、変更には人間の承認が要る（AGENTS.md 地雷5）。費用を詰める
  # ための旋盤ではないので、既定は動かさない（空のままでよい）。
  #
  # **manager / worker を読むのは runner である**（SDK へ `model:` を渡すのはあの器で、
  # そこが正本になる）。デーモンも同じ値を読むが、使うのは自己認識に載せる**宣言**の
  # ためだけである。両者が食い違わないのは、この `x-shared-env` が同じ値を両方の役へ
  # 渡しているから（役ごとに違う唯一の変数は `ALTEROID_DATABASE_URL` である）。
  #
  # **ここは「先に実行環境プロファイルを検討する」の例外で、あちらでは解けない。**
  # 読むのは器（デーモンと runner）自身の `process.env` で、プロファイルが評価される
  # のはその先の SDK 子プロセスなので届かない。そしてプロファイルは**クローン自身が
  # `profile_write` で書ける**ので、そこから読めばクローンが自分のモデル帯を黙って
  # 差し替えられる ＝ 承認が承認でなくなる。
  #
  # **`${VAR:-}` の空文字で渡して安全である。** 空・空白のみは「未設定」として既定へ
  # 落ちる（`packages/core/src/model-tier.ts`）ので、空が未設定より悪くなる `GIT_*` とは
  # 事情が違う。
  ALTEROID_CLONE_MODEL: ${ALTEROID_CLONE_MODEL:-}
  ALTEROID_MANAGER_MODEL: ${ALTEROID_MANAGER_MODEL:-}
  ALTEROID_WORKER_MODEL: ${ALTEROID_WORKER_MODEL:-}
  # 自律の既定（日報・発意）は環境変数で開け閉めできる。これは方針であって
  # 実行回数の制限ではない（north_star 禁止2）。
  # **フォールバック値はコード側の既定（`apps/daemon/src/schedule.ts` の
  # `DEFAULT_INITIATIVE_EVERY_MINUTES`。理由はそちらの JSDoc）と必ず揃えること** —
  # ここで別の値に固定すると、このデーモンは常に環境変数を受け取る形になるので、
  # コード側の既定は compose 経由の起動では一度も使われず、直したつもりの既定が
  # 静かに無効になる。
  ALTEROID_DAILY_REPORT_AT: ${ALTEROID_DAILY_REPORT_AT:-22:00}
  ALTEROID_INITIATIVE_EVERY: ${ALTEROID_INITIATIVE_EVERY:-55}
  TZ: ${TZ:-Asia/Tokyo}
  # 入口の認証（誰がこの HTTP API を叩いてよいか）。**人間が置くのはここ1か所**で、
  # **走っている runner には残らない** — `docker/alteroid-runner` が `exec` の前に
  # 落とす（合鍵を sha256 へ畳むのと同じ形）。
  #
  # 落とす理由は合鍵と同じで、UID の分離が崩れた場面で子プロセス（＝マネージャー）が
  # `/proc/1/environ` から読めてしまうからである。読めた瞬間、自分でアクセストークンを
  # 発行して API 経由で記憶へ届く。**伏せるのは上＝記憶へ到達する鍵**であって、
  # 下＝外の世界へ手を伸ばす鍵（`GH_TOKEN`）とは扱いが逆になる。
  #
  # 未設定なら認証を要求しない（ポートを公開していない既定の構成では、境界は
  # 待ち受け先の側にある）。
  ALTEROID_GOOGLE_CLIENT_ID: ${ALTEROID_GOOGLE_CLIENT_ID:-}
  ALTEROID_GOOGLE_CLIENT_SECRET: ${ALTEROID_GOOGLE_CLIENT_SECRET:-}
  # 認証を要求するかは鍵の有無から決まるが、**方針は設定で開けられること**
  # （north_star 禁止2）。`on` / `off` で明示的に上書きできる。空は「自動」。
  ALTEROID_AUTH: ${ALTEROID_AUTH:-}
  # 発行するアクセストークンの寿命（日）。`off` で無期限。空なら既定の 30 日。
  ALTEROID_ACCESS_TOKEN_TTL_DAYS: ${ALTEROID_ACCESS_TOKEN_TTL_DAYS:-}
  # ブラウザが戻ってくる先の起点。**外から届く URL を書く**（プロバイダに登録する
  # Redirect URI は `<これ>/auth/google/callback` の1本だけでよい）。
  ALTEROID_PUBLIC_URL: ${ALTEROID_PUBLIC_URL:-}
  # GitHub を触るための鍵と、コミットの身元。**これは下＝外の世界へ手を伸ばす鍵で
  # あり、渡すのが正しい**（記憶ストアの鍵と逆。伏せると人間が Claude Code でできる
  # `gh pr create` が層を下りた瞬間にできなくなる＝デグレード。north_star 禁止1）。
  # クローンも人間と同じく自分の手を持つので、app にも同じものが渡る。
  #
  # 無くても壊れない。公開リポジトリの clone は鍵なしで通り、**push と PR 作成に
  # だけ要る**。`GIT_*` を `git config` ではなく環境変数で渡すのは、器を作り直す
  # たびに設定が消えるからである。
  #
  # **値を書かない行**は「置かれていれば渡す / 無ければ未設定のまま」の意味である。
  # `${VAR:-}` のように空文字で渡してはいけない（空の `GIT_AUTHOR_NAME` は git を
  # `empty ident name` で落とす＝未設定より悪い）。
  GH_TOKEN:
  GIT_AUTHOR_NAME:
  GIT_AUTHOR_EMAIL:
  GIT_COMMITTER_NAME:
  GIT_COMMITTER_EMAIL:

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alteroid
      # 既定値を置かない。置けば「compose を読めば入れる」DB になる。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?推測できない値を .env に置くこと}
      POSTGRES_DB: alteroid
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alteroid -d alteroid']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    restart: unless-stopped

  # manager-runner — SDK（マネージャーと作業者）を隔離して走らせる。
  # **ここに記憶ストアの鍵を足さないこと。** 足した瞬間、分離した意味が消える。
  runner:
    build:
      context: .
      # クローンの自己認識に載るリビジョン。空でよい（「不明」と正直に伝わる）。
      # 渡すなら `.env` に `ALTEROID_BUILD_REV=$(git rev-parse --short HEAD)`。
      args:
        ALTEROID_BUILD_REV: ${ALTEROID_BUILD_REV:-}
    # 役を選ぶ。`node` を直に叩かない — このスクリプトが合鍵を sha256 へ畳んで
    # 素の値を環境から落としてから exec する（`docker/alteroid-runner`）。
    command: ['alteroid-runner']
    # **root で走らせる。** 子プロセス（マネージャーと作業者）を uid 1001 へ降ろす
    # のに特権が要るためで、権限を配るためではない。降りた先の worker は非特権である。
    user: root
    environment: *shared-env
    volumes:
      # マネージャーが実際に触るプロジェクト。人間が Claude Code を開く場所と同じ
      # 意味を持つ。**MCP 設定（.mcp.json）もここに置く** — cwd がこの場所なので、
      # 人間が使っているのと同じ連携がマネージャーからも見える（下向きの可視性）。
      # 既定は名前付き volume（uid 1001 の所有で初期化される）。ホストのディレクトリを
      # 使うなら、その所有者を uid 1001 に揃えること。
      - ${ALTEROID_WORKSPACE_HOST:-workspace}:/workspace
      - control:/run/alteroid
    healthcheck:
      # 生存確認だけの口（制御面の情報は返さない）。ソケット越しに叩く。
      test:
        [
          'CMD-SHELL',
          'curl -fsS --unix-socket /run/alteroid/runner.sock http://runner/livez || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    # 走行中のマネージャーを畳み、生ログをデーモンへ渡し切る時間。
    # **この値を変えるなら `apps/runner/src/index.ts` の強制 exit も見ること。**
    # あちらは「ここより5秒早く自分で exit する」形で、この数の写しを持っている。
    stop_grace_period: 60s
    networks: [control]
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        ALTEROID_BUILD_REV: ${ALTEROID_BUILD_REV:-}
    # 役を選ぶ（root で来たら node へ降りる。`docker/alteroidd`）。
    command: ['alteroidd']
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_healthy
    environment:
      <<: *shared-env
      # **役ごとに違う唯一の変数。** 記憶・日誌・ジョブ・セッションの置き場であり、
      # この鍵はデーモンだけが持つ。共通ブロックへ移さないこと。
      ALTEROID_DATABASE_URL: postgres://alteroid:${POSTGRES_PASSWORD}@db:5432/alteroid
    volumes:
      # state（daemon.json）だけ。記憶は PostgreSQL 側にある。
      - state:/data/alteroid
      # runner への口（Unix ソケット）。**runner の workspace は覗かない。**
      - control:/run/alteroid
    # 落ちる前の最後の蒸留（クローンのターン1本）が終わるまで待つ。既定の 10 秒だと
    # 途中で SIGKILL され、記憶へ移すはずだったものが消える（蒸留は生存条件）。
    # **この値を変えるなら `apps/daemon/src/index.ts` の強制 exit も見ること。**
    # あちらは「ここより5秒早く自分で exit する」形で、この数の写しを持っている。
    stop_grace_period: 60s
    # data で db へ、control で runner へ。**runner は data に居ない**ので、
    # 鍵を手に入れても DB への経路が無い。
    networks: [data, control]
    restart: unless-stopped

networks:
  data:
  control:

volumes:
  db:
  state:
  workspace:
  # デーモンと runner の間の口（Unix ソケット）だけを置く場所
  control:
